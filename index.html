<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORBIT — Social Universe</title>
<style>
:root{--ui:#e9ecff;--mut:#8b91b8;--c:#ffb347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ui);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(120% 90% at 50% 40%,#10122b 0%,#070815 55%,#03040a 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
canvas.drag{cursor:grabbing}
canvas.hit{cursor:pointer}
.top{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.brand b{font-size:18px;letter-spacing:.32em;font-weight:800;text-shadow:0 0 18px rgba(255,170,80,.6)}
.brand small{display:block;color:var(--mut);font-size:11px;margin-top:4px;letter-spacing:.04em;max-width:190px;line-height:1.35;transition:opacity .5s}
.tools{display:flex;gap:6px;pointer-events:auto}
.btn{background:rgba(20,23,48,.72);border:1px solid rgba(255,255,255,.14);color:var(--ui);border-radius:999px;padding:6px 11px;font:600 12px system-ui;backdrop-filter:blur(8px);cursor:pointer}
.btn.on{border-color:#ffd27a;color:#ffd27a}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:4;scrollbar-width:none;transition:transform .35s,opacity .35s}
.dock::-webkit-scrollbar{display:none}
.dock.hide{transform:translateY(120%);opacity:0;pointer-events:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;background:rgba(14,17,38,.78);border:1px solid rgba(255,255,255,.14);color:var(--ui);border-radius:999px;padding:5px 12px 5px 5px;font:600 13px system-ui;backdrop-filter:blur(8px);cursor:pointer}
.chip img{width:26px;height:26px;border-radius:50%;display:block}
.chip.core,.chip.add{padding-left:12px;color:#ffd27a;border-color:rgba(255,210,122,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;height:56vh;display:flex;flex-direction:column;background:rgba(9,11,24,.93);backdrop-filter:blur(14px);border-radius:22px 22px 0 0;border:1px solid rgba(255,255,255,.1);border-bottom:0;border-top:2px solid var(--c);box-shadow:0 -10px 40px rgba(0,0,0,.5),0 -2px 30px color-mix(in srgb,var(--c) 35%,transparent);transform:translateY(106%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:6}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:8px auto 2px;flex:none}
.head{display:flex;align-items:center;gap:12px;padding:8px 16px 10px;flex:none}
.head img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.head .t{flex:1;min-width:0}
.head h2{margin:0;font-size:18px}
.head p{margin:2px 0 0;color:var(--mut);font-size:12px}
.join{background:var(--c);color:#0a0b16;border:0;border-radius:999px;padding:8px 16px;font:800 13px system-ui;cursor:pointer}
.join.on{background:transparent;color:var(--c);border:1px solid var(--c)}
.x{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;padding:0 0 0 4px}
.compose,.searchrow{display:flex;gap:8px;padding:0 16px 10px;flex:none}
.compose input,.searchrow input,.form input[type=text]{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--ui);padding:10px 12px;font:14px system-ui;outline:none;width:100%}
.compose input:focus,.searchrow input:focus,.form input:focus{border-color:var(--c)}
.compose button,.primary{background:var(--c);border:0;border-radius:12px;color:#0a0b16;font:800 13px system-ui;padding:0 16px;cursor:pointer}
.feed{flex:1;overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.post{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:11px 12px}
.post .m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.post .m b{color:var(--ui);font-size:13px}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 11px system-ui;color:#0a0b16;background:var(--c)}
.post .m img{width:20px;height:20px;border-radius:50%;margin-left:auto}
.post p{margin:7px 0 6px;font-size:14px;line-height:1.4;word-break:break-word}
.like{background:none;border:0;color:var(--mut);font:600 12px system-ui;cursor:pointer;padding:2px 0}
.like.on{color:#ff6b8b}
.card{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;cursor:pointer;text-align:left;color:var(--ui);font:inherit;width:100%;flex:none}
.card img{width:40px;height:40px;border-radius:50%;flex:none}
.card b{font-size:14px;display:block}
.card span{font-size:12px;color:var(--mut)}
.card.cta{border:1px dashed rgba(255,179,71,.55);background:rgba(255,179,71,.07)}
.plus{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,179,71,.18);color:#ffb347;font-size:22px;flex:none}
.h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:6px 0 0;flex:none}
.row2{display:flex;gap:8px;flex-wrap:wrap;flex:none}
.del{background:none;border:1px solid rgba(255,107,139,.4);color:#ff8fa8;border-radius:12px;padding:9px;font:600 12px system-ui;cursor:pointer;flex:none}
.form{flex:1;overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.form label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:5px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw button.sel{border-color:#fff;box-shadow:0 0 12px currentColor}
.logorow{display:flex;gap:10px;align-items:center}
.prv{width:62px;height:62px;border-radius:50%;flex:none;box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.primary{padding:13px 16px;font-size:14px}
.primary:disabled{opacity:.35;cursor:default}
@media(min-width:700px){.sheet{height:48vh;border-radius:22px;bottom:14px;border-bottom:1px solid rgba(255,255,255,.1)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div class="brand"><b>ORBIT</b><small id="hint">drag to rotate · pinch / scroll to zoom · tap a planet</small></div>
  <div class="tools">
    <button class="btn" id="bPause">Pause</button>
    <button class="btn on" id="bSpin">Spin</button>
    <button class="btn" id="bReset">Reset</button>
  </div>
</div>
<div class="dock" id="dock"></div>
<div class="sheet" id="sheet"></div>

<script>
/* ======================================================================
   ORBIT — scalable social galaxy
   • Add communities forever: orbits auto-layout into lanes (more planets
     share outer lanes), elliptical Kepler motion, trails, moons, belts.
   • Built-in worlds are in BASE below. Users can create more (saved locally).
   • Swap any logo: add  logoUrl:'https://…'  to an entry.
   ====================================================================== */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const COLORS=['#ff7a3d','#ff4d8d','#b45cff','#3aa0ff','#2fd3c4','#3ddc84','#ffd23f','#ff5b5b'];
let RT=performance.now()/1000;           // real time (seconds)
let T=0;                                  // simulation time (pauses)

function lighten(hex,a){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.round(v+(255-v)*a);return `rgb(${m(r)},${m(g)},${m(b)})`}
function hsl2hex(h,s,l){h/=360;const f=n=>{const k=(n+h*12)%12;const a=s*Math.min(l,1-l);const v=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*v).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const SEG=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter(undefined,{granularity:'grapheme'}):null;
function gr(t){t=String(t||'');return SEG?Array.from(SEG.segment(t),x=>x.segment):Array.from(t)}
function initials(n){const w=String(n||'').trim().split(/\s+/);return (((w[0]||'?')[0]||'?')+(w[1]?w[1][0]:'')).toUpperCase()}
function mk(color,glyph){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${lighten(color,.35)}"/><stop offset="1" stop-color="${color}"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#g)"/>${glyph}</svg>`}
function textGlyph(t){const a=gr(t).slice(0,2);const fs=a.length<=1?54:40;return `<text x="50" y="50" dy=".35em" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-weight="800" font-size="${fs}" fill="#fff">${esc(a.join(''))}</text>`}

const GLYPH={
  forge:c=>`<g fill="#fff"><rect x="24" y="24" width="22" height="22" rx="3"/><rect x="54" y="24" width="22" height="22" rx="3" opacity=".55"/><rect x="24" y="54" width="22" height="22" rx="3" opacity=".55"/><rect x="54" y="54" width="22" height="22" rx="3"/></g>`,
  beats:c=>`<g fill="#fff"><rect x="21" y="40" width="10" height="26" rx="5"/><rect x="35" y="24" width="10" height="52" rx="5"/><rect x="55" y="32" width="10" height="40" rx="5"/><rect x="69" y="44" width="10" height="20" rx="5"/></g>`,
  roots:c=>`<path d="M50 80C26 72 20 42 30 26c26 0 48 8 48 32 0 13-11 22-28 22z" fill="#fff"/><path d="M34 70C44 56 52 47 64 38" stroke="#0b2a17" stroke-width="4.5" fill="none" stroke-linecap="round"/>`,
  labs:c=>`<g fill="none" stroke="#fff" stroke-width="5"><ellipse cx="50" cy="50" rx="31" ry="12"/><ellipse cx="50" cy="50" rx="31" ry="12" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="31" ry="12" transform="rotate(120 50 50)"/></g><circle cx="50" cy="50" r="7" fill="#fff"/>`,
  ink:c=>`<path d="M50 18C50 18 27 46 27 61a23 23 0 0046 0C73 46 50 18 50 18z" fill="#fff"/><circle cx="42" cy="63" r="6.5" fill="${c}"/>`,
  owls:c=>`<mask id="m"><rect width="100" height="100" fill="#fff"/><circle cx="62" cy="40" r="26" fill="#000"/></mask><circle cx="46" cy="54" r="28" fill="#fff" mask="url(#m)"/><path d="M72 24l3.2 7.6 7.6 3.2-7.6 3.2L72 45.6l-3.2-7.6-7.6-3.2 7.6-3.2z" fill="#fff"/>`
};
const BASE=[
 {id:'forge',name:'Pixel Forge',tag:'Indie devs & game makers',color:'#ff7a3d',members:1840,seed:[
   ['@kira',12,'Jam theme just dropped: "gravity is optional". Who is in?',34],['@bytewolf',95,'Shipped my first shader today. It looks like soup. I love it.',21],['@nanoo',420,'Hot take: 16 colors is plenty.',57]]},
 {id:'beats',name:'Neon Beats',tag:'Producers, DJs & night sounds',color:'#b45cff',members:2310,seed:[
   ['@luma',8,'Uploaded a 90 bpm loop pack. Free, no strings.',48],['@dj.sol',150,'Anyone mixing live from the browser? Looking for tips.',19],['@vex',600,'Basslines at 3am hit different.',63]]},
 {id:'roots',name:'Green Roots',tag:'Plants, gardens & slow living',color:'#3ddc84',members:960,seed:[
   ['@fernando',30,'My monstera just grew a new leaf. Proud parent moment.',72],['@mate.verde',210,'Compost starter guide pinned below, ask anything.',25],['@yuyo',780,'What grows best on a tiny balcony?',14]]},
 {id:'labs',name:'Deep Blue Labs',tag:'Science, space & big questions',color:'#3aa0ff',members:3120,seed:[
   ['@dr.orbit',5,'New exoplanet candidate is in the data. Thread inside.',121],['@quark',75,'Explain entropy like I am five. Best answer wins nothing, only glory.',44],['@nova',500,'Reminder: look up tonight.',90]]},
 {id:'ink',name:'Ink & Canvas',tag:'Illustration, design & color',color:'#ff4d8d',members:2705,seed:[
   ['@pixa',18,'Weekly prompt: "a city that floats". Post by Sunday.',58],['@sumi',240,'Warm gray + hot pink is a perfect combo and I will not be taking questions.',66],['@lino',900,'Sharing my brush set, 12 free brushes.',37]]},
 {id:'owls',name:'Night Owls',tag:'Late-night chat & good company',color:'#ffd23f',members:4020,seed:[
   ['@insomnia',3,'It is 3am, what are we all doing awake?',81],['@moth',60,'Drop one song that fits this exact hour.',52],['@luz',360,'Tea or coffee at this time? Be honest.',29]]}
];
const BASE_IDS=new Set(BASE.map(b=>b.id));
const BOOT=Date.now();
const DEMO=[['Mate Club','🧉','Yerba, charla y buena onda'],['Asado Society','🥩','Fire, meat and patience'],['Tango Café','💃','Slow nights, sharp steps'],['Pixel Arcade','🕹️','Retro games forever'],['Skate Society','🛹','Spots, tricks, clips'],['Chess Orbit','♟️','Openings and blunders'],['Vinyl Vault','💿','Crate diggers unite'],['Cine Club','🎞️','Films worth staying up for'],['Moto Crew','🏍️','Two wheels, no rules'],['Sneaker Drop','👟','Fresh pairs, fair prices'],['Lofi Lounge','🎧','Chill beats to build to'],['Paw Planet','🐾','All the good pets'],['Dev Den','💻','Ship it small'],['Book Void','📚','One more chapter'],['Street Lens','📷','Cities in frames'],['Gym Gravity','🏋️','Lift, log, repeat'],['Coffee Cartel','☕','Beans over everything'],['Anime Nebula','🌸','Seasonal hype and classics'],['Fútbol Fanáticos','⚽','Fierce, loyal, loud'],['Cosmic Cooks','🍳','Recipes from the void']];

/* ============ saved state ============ */
let S={joined:{},likes:{},posts:{},custom:[]};
try{const r=localStorage.getItem('orbit_v2');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!Array.isArray(S.custom))S.custom=[];
function save(){try{localStorage.setItem('orbit_v2',JSON.stringify(S))}catch(e){}}

/* ============ communities (hydrated) ============ */
const HY={};let ALL=[],byId={};
function makeSrc(d){
  if(d.logoImg)return d.logoImg;
  if(d.logoUrl)return d.logoUrl;
  const g=GLYPH[d.id]?GLYPH[d.id](d.color):textGlyph(d.logo||initials(d.name||'?'));
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(mk(d.color,g));
}
function hyd(d,born,pend){
  if(HY[d.id])return HY[d.id];
  const c=Object.assign({},d);
  c.custom=!BASE_IDS.has(d.id);c.seed=d.seed||[];
  c.src=makeSrc(d);c.img=new Image();c.img.src=c.src;
  c.born=born;c.pend=!!pend;c.pulseAt=-99;c.pos=[0,0,0];c.pj={x:0,y:0,z:1,s:1};c.off=undefined;c.lane=null;
  HY[d.id]=c;return c;
}
function syncAll(){
  ALL=BASE.concat(S.custom).map((d,i)=>hyd(d,RT+.3+Math.min(i*.14,2.6),false));
  byId={};ALL.forEach(c=>byId[c.id]=c);
}

/* ============ orbit layout: lanes ============ */
const LANES=[];let BELTS=[],outerR=250,sizeMul=1;
function laneDef(i){
  const r=250+i*92;
  const e=.03+(Math.sin(i*12.9898)*.5+.5)*.09;
  const inc=(i%2?-1:1)*(.06+(Math.sin(i*78.233)*.5+.5)*.24);
  const node=i*2.399963;
  return{idx:i,r,e,b:Math.sqrt(1-e*e),inc,node,ci:Math.cos(inc),si:Math.sin(inc),cn:Math.cos(node),sn:Math.sin(node),w:.34*Math.pow(250/r,1.5),dir:i%2?-1:1,members:[]};
}
function lanePt(L,E,o){
  const x=L.r*(Math.cos(E)-L.e),z0=L.r*L.b*Math.sin(E);
  const y=z0*L.si,z=z0*L.ci;
  o[0]=x*L.cn+z*L.sn;o[1]=y;o[2]=-x*L.sn+z*L.cn;return o;
}
function kep(M,e,it){let E=M;for(let i=0;i<(it||4);i++)E=M+e*Math.sin(E);return E}
function angd(a,b){return((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI}
function g3(){return(Math.random()+Math.random()+Math.random()-1.5)/1.5}
function mkBelt(r,w,th,n,dir){
  const B={r,n,dir,w:.34*Math.pow(250/r,1.5)*.8,cx:new Float32Array(n),sx:new Float32Array(n),rr:new Float32Array(n),yy:new Float32Array(n),bx:new Float32Array(n),by:new Float32Array(n),bz:new Float32Array(n)};
  for(let i=0;i<n;i++){const a=Math.random()*TAU;B.cx[i]=Math.cos(a);B.sx[i]=Math.sin(a);B.rr[i]=r+g3()*w;B.yy[i]=g3()*th}
  return B;
}
function layout(){
  LANES.length=0;
  let i=0,lane=0;
  while(i<ALL.length){
    const cap=1+Math.floor(lane/4);          // outer lanes hold more planets
    const L=laneDef(lane);
    for(let k=0;k<cap&&i<ALL.length;k++)L.members.push(ALL[i++]);
    LANES.push(L);lane++;
  }
  for(const L of LANES)L.members.forEach((c,k)=>{
    c.lane=L;c.toff=k/L.members.length*TAU+L.idx*1.7;
    if(c.off===undefined)c.off=c.toff;
    const base=clamp(30+Math.log10((c.members||1)+10)*6,36,54);
    c.baseSize=base;
  });
  outerR=LANES.length?LANES[LANES.length-1].r*(1+.12):250;
  sizeMul=clamp(Math.pow(outerR/760,.4),1,1.8);
  BELTS=[];
  if(LANES.length>=6)BELTS.push(mkBelt(250+3.5*92,16,8,1000,1));
  BELTS.push(mkBelt(outerR+80,26,12,1500,-1));
}
const defDist=()=>clamp((outerR+110)*2.0,1250,7500);

/* ============ camera / projection ============ */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,F=400;
const cam={yaw:.6,pitch:.5,dist:1500,tx:0,ty:0,tz:0};
const want={dist:1500};
let cenY=0,wantCenY=0;
const ca={cy:1,sy:0,cp:1,sp:0};
let PX=0,PY=0,PZ=1,PS=1;
function P(x,y,z,noT){
  if(!noT){x-=cam.tx;y-=cam.ty;z-=cam.tz}
  const x1=x*ca.cy-z*ca.sy,z1=x*ca.sy+z*ca.cy;
  const y2=y*ca.cp+z1*ca.sp,z2=-y*ca.sp+z1*ca.cp+cam.dist;
  PS=F/z2;PX=W/2+x1*PS;PY=cenY-y2*PS;PZ=z2;
}
function proj(x,y,z,noT){P(x,y,z,noT);return{x:PX,y:PY,z:PZ,s:PS}}

/* ============ backdrop ============ */
const STARS=[];
for(let i=0;i<560;i++){
  const u=Math.random()*2-1,a=Math.random()*TAU,r=Math.sqrt(1-u*u);
  STARS.push({x:r*Math.cos(a),y:u,z:r*Math.sin(a),s:Math.random()*1.5+.3,p:Math.random()*6.28,c:['#ffffff','#cfe0ff','#ffe9c4','#ffd0e8'][i%4]});
}
let neb=null;
function buildNeb(){
  const w=Math.ceil(W*1.3*.5),h=Math.ceil(H*1.3*.5);
  neb=document.createElement('canvas');neb.width=w;neb.height=h;
  const x=neb.getContext('2d');
  const blobs=[[.22,.28,.55,'#5b2a9e',.30],[.78,.66,.6,'#1b5ea8',.26],[.5,.5,.4,'#a8431b',.12],[.14,.82,.45,'#1b8a6b',.16],[.88,.18,.5,'#8e2a6e',.18]];
  for(const b of blobs){
    const R=Math.max(w,h)*b[2];
    const g=x.createRadialGradient(b[0]*w,b[1]*h,0,b[0]*w,b[1]*h,R);
    g.addColorStop(0,b[3]);g.addColorStop(1,'rgba(0,0,0,0)');
    x.globalAlpha=b[4];x.fillStyle=g;x.fillRect(0,0,w,h);
  }
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  F=Math.min(W,H)*.95;if(W>H)F=Math.min(F,H*.95);
  wantCenY=selId?H*.25:H*.5;if(!cenY)cenY=wantCenY;
  buildNeb();
}
addEventListener('resize',resize);

/* ============ state for interaction ============ */
let paused=false,spin=true,lastInput=0,selId=null,hoverId=null,hits=[],panelMode='normal';
let hintDone=false;
const waves=[],parts=[];

/* ============ effects ============ */
function burst(c){
  waves.push({t0:RT,color:c.color});
  const q=c.pos;
  for(let i=0;i<46;i++){
    const a=Math.random()*TAU,u=Math.random()*2-1,rr=Math.sqrt(1-u*u),sp=60+Math.random()*170;
    parts.push({x:q[0],y:q[1],z:q[2],vx:rr*Math.cos(a)*sp,vy:u*sp,vz:rr*Math.sin(a)*sp,life:.8+Math.random()*.9,age:0,col:i%3?c.color:'#ffffff'});
  }
}

  g.addColorStop(0,'rgba(0,0,12,0)');g.addColorStop(.45,'rgba(0,0,12,.08)');g.addColorStop(1,'rgba(0,0,12,.62)');

  g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(255,255,255,0)');

const COMET=(()=>{const e=.88,inc=.9,node=.7;return{r:1350,e,b:Math.sqrt(1-e*e),inc,node,ci:Math.cos(inc),si:Math.sin(inc),cn:Math.cos(node),sn:Math.sin(node)}})();
const CP=[0,0,0];
function cometState(){
  const M=T*.05+1.2,E=kep(M,COMET.e,8);

}
function drawComet(sp){
  const q=cometState();

  const hx=PX,hy=PY,hs=PS;
  const tl=260;P(q[0]+q[0]/d*tl,q[1]+q[1]/d*tl,q[2]+q[2]/d*tl);
  const tx=PX,ty=PY;
  const inten=clamp(1.25-d/1500,.25,1);

  const g=ctx.createLinearGradient(hx,hy,tx,ty);
  g.addColorStop(0,`rgba(190,225,255,${.75*inten})`);g.addColorStop(1,'rgba(120,170,255,0)');
  const nx=-(ty-hy),ny=tx-hx,nl=Math.hypot(nx,ny)||1,w=Math.max(2,6*hs*40*.1);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(hx+nx/nl*w,hy+ny/nl*w);ctx.lineTo(tx,ty);ctx.lineTo(hx-nx/nl*w,hy-ny/nl*w);ctx.fill();

  hg.addColorStop(0,'rgba(255,255,255,.95)');hg.addColorStop(.3,'rgba(170,215,255,.5)');hg.addColorStop(1,'rgba(120,170,255,0)');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,hr*3,0,7);ctx.fill();

function drawFX(dt){

    const q=parts[i];q.age+=dt;
    if(q.age>q.life){parts.splice(i,1);continue}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vx*=.985;q.vy*=.985;q.vz*=.985;

/* ============ main loop ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;RT=now/1000;
  if(!paused)T+=dt;
  ca.cy=Math.cos(cam.yaw);ca.sy=Math.sin(cam.yaw);ca.cp=Math.cos(cam.pitch);ca.sp=Math.sin(cam.pitch);
  for(const c of ALL){
    const L=c.lane;if(!L)continue;
    c.off+=angd(c.off,c.toff)*Math.min(1,dt*2.5);
    c.M=c.off+L.dir*T*L.w;
    lanePt(L,kep(c.M,L.e),c.pos);
    if(c.pend&&RT>=c.born){c.pend=false;burst(c)}
  }
  const tgt=(selId&&selId!=='core'&&byId[selId])?byId[selId].pos:[0,0,0];
  const k=1-Math.exp(-dt*5);
  cam.tx+=(tgt[0]-cam.tx)*k;cam.ty+=(tgt[1]-cam.ty)*k;cam.tz+=(tgt[2]-cam.tz)*k;
  cam.dist+=(want.dist-cam.dist)*k;cenY+=(wantCenY-cenY)*k;
  if(spin&&!dragging&&now-lastInput>2500)cam.yaw+=dt*.1;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);hits=[];
  if(neb){ctx.globalAlpha=.9;ctx.drawImage(neb,-W*.15+Math.sin(cam.yaw)*28,-H*.15+cam.pitch*28,W*1.3,H*1.3);ctx.globalAlpha=1}
  drawStarsBg(now/1000);
  P(0,0,0);const sp={x:PX,y:PY,z:PZ,s:PS};
  projBelts();
  drawBelts(true,sp.z);
  drawRings();drawWaves();
  const list=[{z:sp.z,f:()=>drawStar(sp,now/1000)}];
  for(const c of ALL){
    if(!c.lane)continue;
    P(c.pos[0],c.pos[1],c.pos[2]);
    if(PZ<40)continue;
    c.pj.x=PX;c.pj.y=PY;c.pj.z=PZ;c.pj.s=PS;
    list.push({z:PZ,f:()=>drawPlanet(c,sp)});
  }
  const cq=cometState();P(cq[0],cq[1],cq[2]);
  if(PZ>40){const cz=PZ;list.push({z:cz,f:()=>drawComet(sp)})}
  list.sort((a,b)=>b.z-a.z);
  for(const o of list)o.f();
  drawBelts(false,sp.z);

  const submit=()=>{
    const t=input.value.trim();if(!t)return;
    (S.posts[c.id]=S.posts[c.id]||[]).unshift({ts:Date.now(),t});S.joined[c.id]=1;save();c.pulseAt=RT;renderPanel();
  };
  input.onkeydown=e=>{if(e.key==='Enter')submit()};
  sheet.append(
    h('div',{class:'grab'}),
    h('div',{class:'head'},logo(c),
      h('div',{class:'t'},h('h2',null,c.name),h('p',null,`${c.tag} · ${fmt((c.members||0)+(joined?1:0))} members`)),
      h('button',{class:'join'+(joined?' on':''),onclick:()=>{if(joined)delete S.joined[c.id];else S.joined[c.id]=1;save();renderPanel()}},joined?'Joined':'Join'),
      h('button',{class:'x',onclick:()=>select(null),'aria-label':'Close'},'×')),
    h('div',{class:'compose'},input,h('button',{onclick:submit},'Post')),
    feed
  );
}
function renderCore(){
  sheet.style.setProperty('--c','#ffb347');
  const feed=h('div',{class:'feed'});
  let q='';
  const cta=h('button',{class:'card cta',onclick:()=>select('core','form')},h('div',{class:'plus'},'＋'),h('div',null,h('b',null,'Create a community'),h('span',null,'Adds a new planet to the system')));
  const fill=()=>{
    feed.innerHTML='';
    if(!q)feed.append(cta);
    feed.append(h('div',{class:'h3'},q?'Results':'Communities · '+ALL.length));
    const list=ALL.filter(c=>!q||(c.name+' '+c.tag).toLowerCase().includes(q));
    list.forEach(c=>{
      const j=!!S.joined[c.id];
      feed.append(h('button',{class:'card',onclick:()=>select(c.id)},logo(c),
        h('div',null,h('b',null,c.name),h('span',null,`${c.tag} · ${fmt((c.members||0)+(j?1:0))}${j?' · joined':''}`))));
    });
    if(!list.length)feed.append(h('p',{style:'color:var(--mut);font-size:13px;margin:4px 0'},'No worlds match.'));
    if(!q){
      feed.append(h('div',{class:'h3'},'Latest transmissions'));
      const all=ALL.flatMap(postsFor).sort((a,b)=>b.ts-a.ts).slice(0,10);
      all.forEach(p=>feed.append(postEl(p,true,fill)));
      const row=h('div',{class:'row2'},h('button',{class:'btn',onclick:()=>addDemo(10)},'✨ Add 10 demo worlds'));
      if(S.custom.some(x=>x.demo))row.append(h('button',{class:'btn',onclick:removeDemo},'Remove demo worlds'));
      feed.append(h('div',{class:'h3'},'Stress test'),row);
    }
  };
  fill();
  const total=ALL.reduce((n,c)=>n+(c.members||0)+(S.joined[c.id]?1:0),0);
  const head=h('div',{class:'head'},
    h('div',{class:'av',style:'width:52px;height:52px;font-size:24px;background:radial-gradient(circle at 35% 35%,#fffbe6,#ffb347 55%,#ff7a2a)'},'✦'),
    h('div',{class:'t'},h('h2',null,'Orbit Core'),h('p',null,`${ALL.length} communities · ${fmt(total)} citizens · ${LANES.length} orbits`)),
    h('button',{class:'x',onclick:()=>select(null),'aria-label':'Close'},'×'));
  sheet.append(h('div',{class:'grab'}),head);
  if(ALL.length>8)sheet.append(h('div',{class:'searchrow'},h('input',{type:'text',placeholder:'Search worlds…',oninput:e=>{q=e.target.value.trim().toLowerCase();fill()}})));
  sheet.append(feed);
}
function renderForm(){
  const st={name:'',tag:'',color:COLORS[S.custom.length%COLORS.length],logo:'',img:null};
  sheet.style.setProperty('--c',st.color);
  const prv=h('img',{class:'prv',alt:''});
  const create=h('button',{class:'primary'},'Launch community');
  const upd=()=>{prv.src=makeSrc({color:st.color,logo:st.logo,name:st.name||'?',logoImg:st.img});sheet.style.setProperty('--c',st.color);create.disabled=st.name.trim().length<2};
  const name=h('input',{type:'text',placeholder:'e.g. Midnight Bakers',maxlength:'28'});
  name.oninput=()=>{st.name=name.value;upd()};
  const tag=h('input',{type:'text',placeholder:'What is it about?',maxlength:'48'});
  tag.oninput=()=>{st.tag=tag.value};
  const lg=h('input',{type:'text',placeholder:'Letter or emoji',maxlength:'6'});
  lg.oninput=()=>{st.logo=lg.value;st.img=null;upd()};
  const file=h('input',{type:'file',accept:'image/*',style:'display:none'});
  file.onchange=()=>{
    const f=file.files&&file.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const s=Math.min(im.width,im.height),cvs=document.createElement('canvas');cvs.width=cvs.height=120;
      const x=cvs.getContext('2d');x.beginPath();x.arc(60,60,60,0,TAU);x.clip();
      x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,120,120);
      st.img=cvs.toDataURL('image/png');upd();
    };im.src=rd.result};
    rd.readAsDataURL(f);
  };
  const sw=h('div',{class:'sw'});
  const swBtns=COLORS.map(col=>{
    const b=h('button',{style:`background:${col};color:${col}`,'aria-label':col});
    b.onclick=()=>{st.color=col;swBtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');upd()};
    if(col===st.color)b.classList.add('sel');sw.append(b);return b;
  });
  create.onclick=()=>{
    if(st.name.trim().length<2)return;
    addCommunity({name:st.name.trim(),tag:st.tag.trim()||'A brand new world',color:st.color,logo:st.logo.trim(),logoImg:st.img});
  };
  upd();
  sheet.append(
    h('div',{class:'grab'}),
    h('div',{class:'head'},prv,h('div',{class:'t'},h('h2',null,'New community'),h('p',null,'It spawns as a new planet in orbit')),
      h('button',{class:'x',onclick:()=>select('core'),'aria-label':'Back'},'×')),
    h('div',{class:'form'},
      h('div',null,h('label',null,'Name'),name),
      h('div',null,h('label',null,'Tagline'),tag),
      h('div',null,h('label',null,'Color'),sw),
      h('div',null,h('label',null,'Logo'),h('div',{class:'logorow'},lg,h('button',{class:'btn',onclick:()=>file.click()},'Upload image'),file)),
      create)
  );
}
function renderPanel(){
  sheet.innerHTML='';
  if(!selId){sheet.classList.remove('open');return}
  sheet.classList.add('open');
  if(panelMode==='form')renderForm();
  else if(selId==='core')renderCore();
  else if(byId[selId])renderComm(byId[selId]);
}
function select(id,mode){
  selId=id;panelMode=mode||'normal';lastInput=performance.now();
  want.dist=id==='core'?820:id?400*Math.max(1,sizeMul*.9):defDist();
  wantCenY=id?H*.25:H*.5;
  dock.classList.toggle('hide',!!id);
  renderPanel();
}
function refreshAll(){syncAll();layout();buildDock();updateStats()}

/* ============ adding / removing communities ============ */
function addCommunity(d){
  const rec={id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:d.name,tag:d.tag,color:d.color,logo:d.logo||'',logoImg:d.logoImg||null,members:1,seed:[],demo:false};
  S.custom.push(rec);S.joined[rec.id]=1;save();
  hyd(rec,RT+.5,true);
  refreshAll();
  select(rec.id);
}
function addDemo(n){
  const used=new Set(ALL.map(c=>c.name));
  const pool=DEMO.filter(x=>!used.has(x[0])).sort(()=>Math.random()-.5);
  const extra=['🪐','🌍','🌙','⭐','☄️','🛰️','🚀'];
  for(let i=0;i<n;i++){
    const it=pool[i]||['World '+(ALL.length+i+1),extra[i%extra.length],'A freshly discovered world'];
    const rec={id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:it[0],tag:it[2],color:Math.random()<.5?COLORS[Math.floor(Math.random()*COLORS.length)]:hsl2hex(Math.random()*360,.8,.58),logo:it[1],logoImg:null,
      members:300+Math.floor(Math.random()*3400),demo:true,
      seed:[['@founder',20+i*7,'Welcome to '+it[0]+'! Say hi and tell us what brought you here.',12+i],['@regular',90+i*11,'Share the best thing you found this week.',5+i]]};
    S.custom.push(rec);hyd(rec,RT+.4+i*.22,true);
  }
  save();refreshAll();
  want.dist=defDist();
  select('core');want.dist=defDist();
}
function dropIds(ids){
  const set=new Set(ids);
  S.custom=S.custom.filter(x=>!set.has(x.id));
  ids.forEach(id=>{delete S.joined[id];delete S.posts[id];delete HY[id];for(const k in S.likes)if(k.indexOf(id+':')===0)delete S.likes[k]});
  save();
}
function removeCommunity(id){dropIds([id]);refreshAll();select(null)}
function removeDemo(){dropIds(S.custom.filter(x=>x.demo).map(x=>x.id));refreshAll();select('core')}

/* ============ boot ============ */
RT=performance.now()/1000;
syncAll();layout();buildDock();
resize();cenY=wantCenY;
want.dist=defDist();cam.dist=defDist()*1.7;
waves.push({t0:RT+.1,color:'#ffb347'});
requestAnimationFrame(frame);
</script>
</body>
</html>
