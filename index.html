<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORBITS — Social Universe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
<style>
:root{
  --ui:#e9ecff;
  --mut:#8b91b8;
  --c:#ffb347;
  --green:#22c55e;
  --red:#ef4444;
  --sol-purple:#9945FF;
  --sol-green:#14F195;
  --glass-border:rgba(255,255,255,.08);
  --font-mono:'Share Tech Mono',ui-monospace,'SF Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden;color:var(--ui);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(120% 90% at 50% 40%,#10122b 0%,#070815 55%,#03040a 100%)}

canvas{
  position:fixed;inset:0;width:100%;height:100%;
  touch-action:none;cursor:grab;display:block;
  transition:filter 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1);
}
canvas.drag{cursor:grabbing}
canvas.hit{cursor:pointer}
body.booting{cursor:wait}
body.booting canvas{filter:blur(28px) brightness(.5);transform:scale(1.12);pointer-events:none}
body.booting .top,body.booting .dock,body.booting .sheet{opacity:0;pointer-events:none}

.top{
  position:fixed;top:0;left:0;right:0;
  padding:calc(12px + env(safe-area-inset-top)) 14px 0;
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:8px;pointer-events:none;z-index:5;
  transition:opacity 1.5s ease;
}
.brand b{
  font-size:18px;letter-spacing:.32em;font-weight:800;
  background:linear-gradient(135deg,#fff 0%,#ffd27a 50%,#ffb347 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,170,80,.45));
}
.brand small{
  display:block;color:var(--mut);font-size:11px;margin-top:4px;
  letter-spacing:.04em;max-width:190px;line-height:1.35;
}
.project-ca{
  display:inline-flex;align-items:center;gap:6px;margin-top:6px;
  padding:4px 10px;background:rgba(255,179,71,.08);
  border:1px solid rgba(255,179,71,.55);border-radius:6px;
  font:800 .7rem var(--font-mono);color:var(--c);
  cursor:pointer;transition:all .2s ease;text-decoration:none;
  box-shadow:inset 0 0 10px rgba(255,179,71,.08);
  pointer-events:auto;
}
.project-ca:hover{background:rgba(255,179,71,.2);box-shadow:0 0 12px rgba(255,179,71,.35);color:#fff}

.tools{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;pointer-events:auto}
@media(max-width:560px){
  .tools{flex-direction:column;align-items:flex-end;gap:6px}
  .brand small{display:none}
  .project-ca{font-size:.62rem;padding:3px 7px}
}
.btn{
  background:rgba(20,23,48,.72);border:1px solid rgba(255,255,255,.14);
  color:var(--ui);border-radius:999px;padding:7px 13px;
  font:600 12px system-ui;backdrop-filter:blur(10px);
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.btn:hover{border-color:#ffd27a;color:#ffd27a;box-shadow:0 0 12px rgba(255,210,122,.2)}
.btn.connected{
  border-color:var(--green);color:var(--green);
  box-shadow:0 0 12px rgba(34,197,94,.25);
}
.btn.connected:hover{border-color:var(--red);color:var(--red);box-shadow:0 0 12px rgba(239,68,68,.25)}

.sol-ticker{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;
  background:linear-gradient(90deg,rgba(153,69,255,.14),rgba(20,241,149,.14));
  border:1px solid rgba(153,69,255,.45);
  font:800 12px var(--font-mono);letter-spacing:.02em;
  backdrop-filter:blur(10px);
  cursor:default;white-space:nowrap;
  transition:box-shadow .3s;
}
.sol-ticker:hover{box-shadow:0 0 16px rgba(153,69,255,.35)}
.sol-ic{
  font-size:13px;
  background:linear-gradient(135deg,var(--sol-purple),var(--sol-green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.sol-px{color:#fff;font-variant-numeric:tabular-nums;transition:color .3s}
.sol-px.up{color:var(--green)}
.sol-px.down{color:var(--red)}
.sol-ch{font-size:10.5px;font-variant-numeric:tabular-nums}
.sol-ch.pos{color:var(--sol-green)}
.sol-ch.neg{color:#ff5c7c}

.online-badge{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(16px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:7px;
  background:rgba(14,17,38,.82);border:1px solid rgba(255,179,71,.55);
  padding:6px 15px;border-radius:999px;
  font:800 12px var(--font-mono);letter-spacing:.1em;color:var(--c);
  box-shadow:0 0 15px rgba(255,179,71,.18),inset 0 0 10px rgba(255,179,71,.08);
  pointer-events:auto;backdrop-filter:blur(12px);z-index:10;
}
.online-badge .dot{
  width:7px;height:7px;background:var(--green);border-radius:50%;
  box-shadow:0 0 8px var(--green),0 0 16px var(--green);
  animation:pulse-dot 2s infinite;
}
@keyframes pulse-dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.5}}
@media(max-width:560px){
  .online-badge{top:calc(82px + env(safe-area-inset-top));font-size:11px;padding:5px 12px}
}

.dock{
  position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;
  overflow-x:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  z-index:4;scrollbar-width:none;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity 1.5s ease;
}
.dock::-webkit-scrollbar{display:none}
.dock.hide{transform:translateY(120%);opacity:0;pointer-events:none}
.chip{
  flex:none;display:flex;align-items:center;gap:7px;
  background:rgba(14,17,38,.78);border:1px solid rgba(255,255,255,.14);
  color:var(--ui);border-radius:999px;padding:5px 12px 5px 5px;
  font:600 13px system-ui;backdrop-filter:blur(10px);cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.chip:hover{border-color:var(--c);transform:translateY(-1px)}
.chip img{width:26px;height:26px;border-radius:50%;display:block;object-fit:cover}
.chip.core,.chip.add{padding-left:12px;color:#ffd27a;border-color:rgba(255,210,122,.45)}
.chip.core:hover,.chip.add:hover{background:rgba(255,210,122,.1)}

/* ═══ FLOATING CHAT CARD ═══ */
.sheet{
  position:fixed;
  left:50%;
  bottom:8px;
  width:calc(100% - 16px);
  max-width:760px;
  height:88vh;
  height:88dvh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(9,11,24,.78),rgba(9,11,24,.96));
  backdrop-filter:blur(28px) saturate(150%);
  -webkit-backdrop-filter:blur(28px) saturate(150%);
  border-radius:24px;
  border:1px solid var(--glass-border);
  border-top:2px solid var(--c);
  box-shadow:
    0 32px 80px rgba(0,0,0,.7),
    0 8px 24px rgba(0,0,0,.5),
    0 0 40px color-mix(in srgb,var(--c) 20%,transparent);
  transform:translate(-50%, calc(100% + 40px));
  transition:transform .42s cubic-bezier(.2,.8,.2,1),background .3s;
  z-index:6;
  will-change:transform;
}
.sheet.open{transform:translate(-50%, 0)}

/* Desktop: center as floating modal */
@media (min-width: 700px) {
  .sheet {
    top:50%;
    bottom:auto;
    height:min(80vh, calc(100vh - 120px));
    transform:translate(-50%, calc(-50% + 40px)) scale(.97);
    opacity:0;
    pointer-events:none;
    transition:
      transform .42s cubic-bezier(.2,.8,.2,1),
      opacity .32s ease,
      background .3s;
  }
  .sheet.open {
    transform:translate(-50%, -50%) scale(1);
    opacity:1;
    pointer-events:auto;
  }
}

.grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:8px auto 2px;flex:none}

.head{
  display:flex;align-items:flex-start;gap:12px;
  padding:8px 16px 14px;flex:none;
}
.head img,.head .av{
  width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;
  align-self:center;
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 55%,transparent);
}
.head .t{flex:1;min-width:0}
.head-top{display:flex;align-items:center;gap:8px}
.head-top h2{
  margin:0;font-size:18px;font-weight:800;letter-spacing:.01em;
  flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.head-actions{display:flex;gap:6px;flex:none;align-items:center}
.head .x{
  background:none;border:0;color:var(--mut);font-size:24px;
  cursor:pointer;padding:0 4px;line-height:1;transition:color .2s;
}
.head .x:hover{color:#ff5c7c}
.head .icon-btn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:var(--ui);font-size:14px;cursor:pointer;padding:6px 9px;
  border-radius:9px;transition:all .2s;line-height:1;
}
.head .icon-btn:hover{background:rgba(255,179,71,.15);border-color:var(--c);color:var(--c)}
.head .icon-btn.danger:hover{background:rgba(239,68,68,.15);border-color:var(--red);color:var(--red)}
.head-meta{
  margin:2px 0 0;color:var(--mut);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.head-stats{
  display:flex;align-items:center;gap:16px;
  margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.07);
  flex-wrap:wrap;row-gap:6px;
  min-height:22px;
}
.hs{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.hs-l{
  font-size:9px;letter-spacing:.1em;color:var(--mut);
  font-weight:800;text-transform:uppercase;
}
.hs-v{
  font-size:13px;font-weight:800;color:var(--ui);
  font-variant-numeric:tabular-nums;
  font-family:var(--font-mono);letter-spacing:-.01em;
  transition:color .3s;
}
.hs-v.big{font-size:15px}
.hs-v.price{color:var(--c)}
.hs-v.pos{color:var(--green)}
.hs-v.neg{color:var(--red)}
.hs-loading{
  font-size:11px;color:var(--mut);font-style:italic;letter-spacing:.04em;
  animation:skeletonPulse 1.5s ease-in-out infinite;
}
@keyframes skeletonPulse{0%,100%{opacity:.4}50%{opacity:.75}}

@media(max-width:480px){
  .head-stats{gap:10px}
  .hs-v{font-size:12px}
  .hs-v.big{font-size:13.5px}
  .hs-l{font-size:8.5px}
}

.feed-wrap{flex:1;position:relative;min-height:0}
.feed-wrap::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:36px;
  background:linear-gradient(to top,rgba(9,11,24,.85),transparent);
  pointer-events:none;
}
.feed{
  height:100%;overflow-y:auto;padding:10px 16px 20px;
  display:flex;flex-direction:column;gap:8px;
  scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--c) 50%,transparent) transparent;
  scroll-behavior:smooth;
}
.feed::-webkit-scrollbar{width:6px}
.feed::-webkit-scrollbar-track{background:transparent}
.feed::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--c) 50%,transparent);border-radius:4px}
.feed::-webkit-scrollbar-thumb:hover{background:var(--c)}

.msg{
  display:flex;gap:10px;padding:9px 11px;border-radius:12px;
  background:rgba(255,255,255,.028);
  border:1px solid rgba(255,255,255,.04);
  transition:background .15s,border-color .15s;
  animation:msgIn .32s cubic-bezier(.2,.8,.2,1);
}
.msg:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.08)}
.msg.mine{background:color-mix(in srgb,var(--c) 8%,transparent);border-color:color-mix(in srgb,var(--c) 22%,transparent)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-av{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;
  font:800 12px system-ui;color:#fff;
  box-shadow:0 0 10px rgba(0,0,0,.35);
}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;gap:8px;align-items:baseline;margin-bottom:3px}
.msg-head b{font-size:12.5px;color:var(--ui);font-weight:700}
.msg-head span{font-size:10.5px;color:var(--mut)}
.msg-body p{margin:0;font-size:14px;line-height:1.45;word-break:break-word;color:#dde2f5}
.loading{color:var(--mut);font-size:13px;text-align:center;padding:24px;font-style:italic}

.jump-btn{
  position:absolute;right:16px;bottom:12px;
  width:38px;height:38px;border-radius:50%;
  background:var(--c);border:0;color:#0a0b16;
  font:800 16px system-ui;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.4),0 0 12px color-mix(in srgb,var(--c) 50%,transparent);
  display:none;place-items:center;z-index:2;
  transition:transform .2s;
}
.jump-btn.show{display:grid}
.jump-btn:hover{transform:scale(1.08)}

.compose{
  display:flex;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  flex:none;border-top:1px solid rgba(255,255,255,.05);
  background:rgba(9,11,24,.75);
  border-radius:0 0 23px 23px;
}
.compose-wrap{flex:1;position:relative;min-width:0}
.compose input{
  width:100%;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);border-radius:12px;
  color:var(--ui);padding:12px 60px 12px 14px;
  font:14px system-ui;outline:none;
  transition:border-color .2s,background .2s;
}
.compose input:focus{border-color:var(--c);background:rgba(255,255,255,.08)}
.compose input:disabled{opacity:.45;cursor:not-allowed}
.char-count{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums;
  pointer-events:none;opacity:0;transition:opacity .2s;
}
.compose input:focus ~ .char-count{opacity:1}
.compose button{
  background:linear-gradient(135deg,var(--c),#ffd27a);
  border:0;border-radius:12px;color:#0a0b16;
  font:800 13px system-ui;padding:0 20px;cursor:pointer;
  transition:filter .2s,box-shadow .2s;white-space:nowrap;
}
.compose button:hover{filter:brightness(1.1);box-shadow:0 0 16px rgba(255,179,71,.4)}
.compose button:disabled{opacity:.4;cursor:not-allowed;filter:none;box-shadow:none}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  backdrop-filter:blur(10px);z-index:20;
  display:none;place-items:center;padding:20px;
}
.modal.open{display:grid}
.modal-box{
  background:linear-gradient(180deg,rgba(20,23,48,.98),rgba(14,17,38,.98));
  border:1px solid rgba(255,255,255,.14);border-radius:20px;
  padding:24px;width:100%;max-width:420px;
  box-shadow:0 24px 48px rgba(0,0,0,.85),0 0 40px rgba(255,179,71,.12);
  animation:modalIn .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h3{margin:0;color:#ffd27a;font-size:16px;letter-spacing:.06em;font-weight:800}
.modal-x{background:none;border:0;color:var(--mut);font-size:24px;cursor:pointer;padding:0 4px;line-height:1;transition:color .2s}
.modal-x:hover{color:#ff5c7c}
.modal-box input{
  width:100%;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);color:#fff;
  padding:13px;font:14px system-ui;margin-bottom:16px;
  border-radius:12px;outline:none;transition:border-color .2s;
}
.modal-box input:focus{border-color:#ffd27a}
.modal-box button.primary{
  width:100%;background:#ffd27a;border:0;color:#0a0b16;
  padding:13px;font:800 14px system-ui;border-radius:12px;
  cursor:pointer;transition:all .2s;
}
.modal-box button.primary:hover{filter:brightness(1.1);box-shadow:0 0 18px rgba(255,210,122,.4)}
.modal-box button.primary:disabled{opacity:.5;cursor:not-allowed;filter:none;box-shadow:none}
.modal-box p{margin:0 0 22px;color:var(--ui);font-size:14.5px;line-height:1.55;text-align:center}

#toast-container{
  position:fixed;top:calc(80px + env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);z-index:9999;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  background:rgba(20,23,48,.96);border:1px solid var(--c);color:#fff;
  padding:10px 20px;border-radius:10px;font:600 13.5px system-ui;
  box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 18px color-mix(in srgb,var(--c) 40%,transparent);
  animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;
  white-space:nowrap;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-12px)}}
</style>
</head>
<body class="booting">
<canvas id="c"></canvas>

<div class="top">
  <div class="brand">
    <b>ORBITS</b>
    <small id="hint">Chatrooms for holders. Just the CA.</small>
    <div class="project-ca" id="projectCA" title="Copy Project CA">
      <span class="icon">📋</span>
      <span class="text">CA: Fqbh...pump</span>
    </div>
  </div>

  <div class="online-badge">
    <span class="dot"></span>
    <span id="online-users-count">0</span> ONLINE
  </div>

  <div class="tools">
    <div class="sol-ticker" id="solTicker" title="Solana price · live">
      <span class="sol-ic">◎</span>
      <span class="sol-px" id="solPrice">$--.--</span>
      <span class="sol-ch" id="solChange">--%</span>
    </div>
    <button class="btn" id="phantomBtn">CONNECT</button>
  </div>
</div>

<div class="dock" id="dock"></div>
<div class="sheet" id="sheet"></div>

    <div class="modal-head">
      <h3>Initialize New World</h3>

    <button class="primary" id="createBtn">Launch Planet</button>
  </div>
</div>

<div class="modal" id="confirmModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 style="color:var(--red)">Confirm Action</h3>
      <button class="modal-x" id="confirmCloseBtn">✕</button>
    </div>
    <p id="confirmMessage"></p>
    <div style="display:flex;gap:12px">
      <button class="primary" id="confirmCancelBtn" style="background:rgba(255,255,255,.08);color:var(--ui);border:1px solid rgba(255,255,255,.18);box-shadow:none">Cancel</button>
      <button class="primary" id="confirmYesBtn" style="background:var(--red);color:#fff;box-shadow:0 0 16px rgba(239,68,68,.4)">Delete</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   0. CONFIG & CLIENT
   ═══════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://lmakgwdrwdhjofgyovkj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_50c1y3L6RfgVDqZPETvUtA_yZQt5our';
const HELIUS_RPC = 'https://mainnet.helius-rpc.com/?api-key=f600a1bb-1023-469b-8b21-1f424fe50931';
const ADMIN_WALLET = '4XAqQmEcJW37ZUqDwwAWhuPy7xfQpTJTLoEUwmi51yuj';
const PROJECT_CA = 'Fqbhnaxf1iTAA1WhRsWNEoR5TRxAaZ3TPgK5xRa9pump';
const GENERAL_ROOM = '00000000-0000-0000-0000-000000000000';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let myUsername = localStorage.getItem('orbit_user') || 'Anon';
let walletAddress = null;

const phantomBtn = document.getElementById('phantomBtn');

/* ═══════════════════════════════════════════════════════════════
   1. UTILITIES
   ═══════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

function esc(s) {
  return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
}
function initials(n) {
  const w = String(n || '').trim().split(/\s+/);
  return (((w[0] || '?')[0] || '?') + (w[1] ? w[1][0] : '')).toUpperCase();
}
function hashColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(h) % 360}, 65%, 52%)`;
}
function fmtPrice(p) {
  if (!p || p <= 0) return '$0.00';
  if (p < 0.00001) return '$' + p.toExponential(2);
  if (p < 0.001) return '$' + p.toFixed(6);
  if (p < 1) return '$' + p.toFixed(4);
  return '$' + p.toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function fmtBig(n) {
  if (!n || n <= 0) return '$0';
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(2) + 'K';
  return '$' + n.toFixed(0);
}
function relTime(ts) {
  const m = Math.max(1, Math.round((Date.now() - new Date(ts).getTime()) / 60000));
  return m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd';
}
function withTimeout(p, ms, label) {
  return Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error((label || 'Request') + ' timed out')), ms))
  ]);
}

/* ═══════════════════════════════════════════════════════════════
   6. TOKEN STATS (DexScreener)
   ═══════════════════════════════════════════════════════════════ */
const statsCache = new Map();
const STATS_TTL = 45000;
let statsReqId = 0;

async function getTokenStats(ca, force = false) {
  if (!ca) return null;
  const cached = statsCache.get(ca);
  if (!force && cached && Date.now() - cached.ts < STATS_TTL) return cached.data;

  try {
    const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${ca}`);
    if (!res.ok) return cached?.data || null;
    const json = await res.json();
    const pairs = json.pairs || [];
    if (!pairs.length) return cached?.data || null;

    pairs.sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
    const pair = pairs[0];

    const data = {
      price: parseFloat(pair.priceUsd) || 0,
      change: parseFloat(pair.priceChange?.h24) || 0,
      volume: parseFloat(pair.volume?.h24) || 0,
      mcap: parseFloat(pair.marketCap || pair.fdv) || 0,
      liquidity: parseFloat(pair.liquidity?.usd) || 0,
      symbol: pair.baseToken?.symbol || '?',
      name: pair.baseToken?.name || 'Unknown'
    };
    statsCache.set(ca, { data, ts: Date.now() });
    return data;
  } catch (e) {
    return cached?.data || null;
  }
}

function renderStatsHTML(data) {
  if (!data) return '<div class="hs-loading">No market data available</div>';
  const pos = data.change >= 0;
  return [
    `<div class="hs"><span class="hs-l">Price</span><span class="hs-v big price">${fmtPrice(data.price)}</span></div>`,
    `<div class="hs"><span class="hs-l">24h</span><span class="hs-v ${pos ? 'pos' : 'neg'}">${pos ? '+' : ''}${data.change.toFixed(2)}%</span></div>`,
    `<div class="hs"><span class="hs-l">Vol</span><span class="hs-v">${fmtBig(data.volume)}</span></div>`,
    `<div class="hs"><span class="hs-l">MCap</span><span class="hs-v">${fmtBig(data.mcap)}</span></div>`
  ].join('');
}

async function renderTokenStats(roomId, ca, container) {
  if (!ca) return;
  const reqId = ++statsReqId;

  const cached = statsCache.get(ca);
  container.innerHTML = cached
    ? renderStatsHTML(cached.data)
    : '<div class="hs-loading">Loading market data…</div>';

  const data = await getTokenStats(ca, true);

  if (reqId !== statsReqId) return;
  if (!container.isConnected) return;
  if (currentRoomId !== roomId) return;

  container.innerHTML = renderStatsHTML(data);
}

/* ═══════════════════════════════════════════════════════════════
   6.5 TOKEN BALANCE CHECK (Helius) — fast + cached + non-blocking
   ═══════════════════════════════════════════════════════════════ */
const balanceCache = new Map();
const BALANCE_TTL = 60000;

async function heliusRpc(method, params, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 8000);
  try {
    const res = await fetch(HELIUS_RPC, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method, params }),
      signal: controller.signal
    });
    if (!res.ok) {
      if (res.status === 429) throw new Error('Rate limited');
      if (res.status === 401 || res.status === 403) throw new Error('Invalid RPC key');
      throw new Error('RPC HTTP ' + res.status);
    }
    const json = await res.json();
    if (json.error) throw new Error(json.error.message || 'RPC error');
    return json.result;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(method + ' timed out');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

async function fetchTokenBalance(wallet, mint) {
  const key = wallet + ':' + mint;
  const cached = balanceCache.get(key);
  if (cached && Date.now() - cached.ts < BALANCE_TTL) return cached.balance;

  let balance = 0;
  let dasOk = false;

  try {
    const result = await heliusRpc('getAssetsByOwner', {
      ownerAddress: wallet,
      page: 1,
      limit: 1000,
      displayOptions: { showFungible: true }
    }, 6000);

    const items = result?.items || [];
    for (const item of items) {
      if (item.id === mint && item.token_info?.balance) {
        const decimals = item.token_info.decimals || 0;
        balance = item.token_info.balance / Math.pow(10, decimals);
        break;
      }
    }
    dasOk = true;
  } catch (e) {
    console.warn('[ORBITS] DAS getAssetsByOwner failed, using fallback:', e.message);
  }

  if (!dasOk) {
    const result = await heliusRpc('getTokenAccountsByOwner', [
      wallet,
      { mint },
      { encoding: 'jsonParsed' }
    ], 12000);
    const accounts = result?.value || [];
    accounts.forEach(acc => {
      balance += acc.account.data.parsed?.info?.tokenAmount?.uiAmount || 0;
    });
  }

  balanceCache.set(key, { balance, ts: Date.now() });
  return balance;
}

function P(x, y, z, noT) {
  if (!noT) { x -= cam.tx; y -= cam.ty; z -= cam.tz; }
  const x1 = x * caCam.cy - z * caCam.sy;
  const z1 = x * caCam.sy + z * caCam.cy;
  const y2 = y * caCam.cp + z1 * caCam.sp;

  PX = W / 2 + x1 * PS;
  PY = cenY - y2 * PS;

let neb = null;
function buildNebula() {
  const w = Math.ceil(W * 1.3 * 0.5), h = Math.ceil(H * 1.3 * 0.5);
  neb = document.createElement('canvas');
  neb.width = w; neb.height = h;
  const x = neb.getContext('2d');
  const blobs = [
    [0.22, 0.28, 0.55, '#5b2a9e', 0.30],
    [0.78, 0.66, 0.60, '#1b5ea8', 0.26],
    [0.50, 0.50, 0.40, '#a8431b', 0.12],
    [0.14, 0.82, 0.45, '#1b8a6b', 0.16],
    [0.88, 0.18, 0.50, '#8e2a6e', 0.18]
  ];
  for (const b of blobs) {
    const R = Math.max(w, h) * b[2];
    const g = x.createRadialGradient(b[0] * w, b[1] * h, 0, b[0] * w, b[1] * h, R);
    g.addColorStop(0, b[3]);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.globalAlpha = b[4];
    x.fillStyle = g;
    x.fillRect(0, 0, w, h);
  }
}

const HY = {};

function hyd(d) {

async function syncAll() {

function laneDef(i) {
  const r = 250 + i * 92;
  const e = 0.03 + (Math.sin(i * 12.9898) * 0.5 + 0.5) * 0.09;
  const inc = (i % 2 ? -1 : 1) * (0.06 + (Math.sin(i * 78.233) * 0.5 + 0.5) * 0.24);
  const node = i * 2.399963;
  return {
    idx: i, r, e,
    b: Math.sqrt(1 - e * e),
    inc, node,
    ci: Math.cos(inc), si: Math.sin(inc),
    cn: Math.cos(node), sn: Math.sin(node),
    w: 0.34 * Math.pow(250 / r, 1.5),
    dir: i % 2 ? -1 : 1,
    members: []
  };
}
function lanePt(L, E, o) {
  const x = L.r * (Math.cos(E) - L.e), z0 = L.r * L.b * Math.sin(E);
  const y = z0 * L.si, z = z0 * L.ci;
  o[0] = x * L.cn + z * L.sn;
  o[1] = y;
  o[2] = -x * L.sn + z * L.cn;
  return o;
}
function kep(M, e, it) {
  let E = M;
  for (let i = 0; i < (it || 4); i++) E = M + e * Math.sin(E);
  return E;
}
function angd(a, b) {
  return ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
}
function g3() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }

function mkBelt(r, w, th, n, dir) {
  const B = {
    r, n, dir,
    w: 0.34 * Math.pow(250 / r, 1.5) * 0.8,
    cx: new Float32Array(n), sx: new Float32Array(n),
    rr: new Float32Array(n), yy: new Float32Array(n),
    bx: new Float32Array(n), by: new Float32Array(n), bz: new Float32Array(n)
  };
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    B.cx[i] = Math.cos(a);
    B.sx[i] = Math.sin(a);
    B.rr[i] = r + g3() * w;
    B.yy[i] = g3() * th;
  }
  return B;
}

function layout() {
  LANES.length = 0;
  let i = 0, lane = 0;
  while (i < ALL.length) {
    const cap = 1 + Math.floor(lane / 4);
    const L = laneDef(lane);
    for (let k = 0; k < cap && i < ALL.length; k++) L.members.push(ALL[i++]);
    LANES.push(L);
    lane++;
  }
  for (const L of LANES) {
    L.members.forEach((c, k) => {
      c.lane = L;
      c.toff = k / L.members.length * TAU + L.idx * 1.7;
      if (c.off === undefined) c.off = c.toff;
      const base = clamp(30 + Math.log10((c.members || 1) + 10) * 6, 36, 54);
      c.baseSize = base;
    });
  }
  outerR = LANES.length ? LANES[LANES.length - 1].r * (1 + 0.12) : 250;
  sizeMul = clamp(Math.pow(outerR / 760, 0.4), 1, 1.8);

  BELTS = [];
  if (LANES.length >= 6) BELTS.push(mkBelt(250 + 3.5 * 92, 16, 8, 900, 1));
  BELTS.push(mkBelt(outerR + 80, 26, 12, 1300, -1));
}

const defDist = () => clamp((outerR + 110) * 2.0, 1250, 7500);

}

function burst(c) {

}
function easeOutBack(x) {
  const c1 = 1.70158, c3 = c1 + 1;

function drawStarsBg(t) {

function projBelts() {

    for (let i = 0; i < B.n; i++) {

      P(r * (c0 * cr - s0 * sr), B.yy[i], r * (s0 * cr + c0 * sr));
      B.bx[i] = PX; B.by[i] = PY; B.bz[i] = PZ;
    }
  }
}
function drawBelts(front, zs) {
  ctx.globalAlpha = 0.55;
  let k = 0;
  for (const B of BELTS) {
    ctx.fillStyle = (k++ % 2) ? '#9fb4d8' : '#c8b79a';
    for (let i = 0; i < B.n; i++) {
      const z = B.bz[i];
      if (z < 40) continue;
      if ((z <= zs) !== front) continue;
      const s = clamp(F / z * 3.2, 1, 2.4);
      ctx.fillRect(B.bx[i], B.by[i], s, s);
    }
  }
  ctx.globalAlpha = 1;
}

const LP = [0, 0, 0];
function drawRings() {
  ctx.lineWidth = 1.2;
  for (const L of LANES) {
    let col = 'rgba(170,185,255,0.13)', al = 1, isHover = false;
    for (const c of L.members) {
      if (selId === c.id) { col = c.color; al = 0.9; isHover = true; break; }
      if (hoverId === c.id) { col = c.color; al = 0.6; isHover = true; }
    }
    ctx.strokeStyle = col;
    ctx.globalAlpha = al;
    if (!isHover) {
      ctx.setLineDash([2, 8]);
      ctx.lineDashOffset = -RT * 15;
    } else {
      ctx.setLineDash([8, 8]);
      ctx.lineDashOffset = -RT * 30;
      ctx.shadowColor = col;
      ctx.shadowBlur = 15;
    }
    ctx.beginPath();
    let pen = false;
    for (let k = 0; k <= 96; k++) {
      lanePt(L, k / 96 * TAU, LP);
      P(LP[0], LP[1], LP[2]);
      if (PZ < 30) { pen = false; continue; }
      if (pen) ctx.lineTo(PX, PY);
      else { ctx.moveTo(PX, PY); pen = true; }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
}

function drawWaves() {
  ctx.globalCompositeOperation = 'lighter';
  const lim = outerR * 1.25 + 200;
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i], R = (RT - w.t0) * 620;
    if (R > lim) { waves.splice(i, 1); continue; }
    ctx.strokeStyle = w.color;
    ctx.globalAlpha = Math.max(0, 0.55 * (1 - R / lim));
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    let pen = false;
    for (let k = 0; k <= 72; k++) {
      const a = k / 72 * TAU;
      P(R * Math.cos(a), 0, R * Math.sin(a));
      if (PZ < 30) { pen = false; continue; }
      if (pen) ctx.lineTo(PX, PY);
      else { ctx.moveTo(PX, PY); pen = true; }
    }
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawStar(p, t) {
  const R = Math.max(60 * p.s, 24);
  const act = (selId === 'core' || hoverId === 'core');
  const pulse = act ? 1 + Math.sin(t * 5) * 0.04 : 1;
  const glowRadius = (act ? R * 4.5 : R * 3.2) * pulse;
  const glowAlpha = act ? 0.95 : 0.6;

  ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(p.x, p.y, R * 0.1, p.x, p.y, glowRadius);
  g.addColorStop(0, `rgba(255,240,180,${glowAlpha})`);
  g.addColorStop(0.3, `rgba(255,160,60,${act ? 0.6 : 0.28})`);
  g.addColorStop(1, 'rgba(255,100,30,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, glowRadius, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.translate(p.x, p.y);
  for (let layer = 0; layer < 2; layer++) {
    ctx.save();
    ctx.rotate((layer ? -1 : 1) * t * (act ? 0.2 : 0.08));
    const n = layer ? 12 : 16;
    for (let i = 0; i < n; i++) {
      ctx.rotate(TAU / n);
      const rayBase = act ? (layer ? 1.8 : 1.4) : (layer ? 1.3 : 1.0);
      const L = R * (rayBase + 0.15 * Math.sin(t * 3 + i * 2.5));
      const gg = ctx.createLinearGradient(0, 0, L, 0);
      const a = act ? 0.8 : 0.32;
      gg.addColorStop(0, layer ? `rgba(255,200,100,${a})` : `rgba(255,255,220,${a})`);
      gg.addColorStop(0.25, layer ? `rgba(255,140,40,${a * 0.6})` : `rgba(255,200,100,${a * 0.6})`);
      gg.addColorStop(1, 'rgba(255,100,30,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      const thick = R * (layer ? 0.04 : 0.07);
      ctx.moveTo(0, -thick);
      ctx.lineTo(L, 0);
      ctx.lineTo(0, thick);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();

  g = ctx.createRadialGradient(p.x - R * 0.15, p.y - R * 0.15, R * 0.05, p.x, p.y, R * pulse);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.4, act ? '#fff0b0' : '#ffd36b');
  g.addColorStop(1, act ? '#ff8a2a' : '#e6731b');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, R * pulse, 0, TAU);
  ctx.fill();

  const q = R * 0.4 * pulse;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - q);
  ctx.quadraticCurveTo(p.x, p.y, p.x + q, p.y);
  ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + q);
  ctx.quadraticCurveTo(p.x, p.y, p.x - q, p.y);
  ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - q);
  ctx.fill();

  ctx.font = `900 ${clamp(R * 0.24, 10, 14)}px system-ui`;
  ctx.textAlign = 'center';
  ctx.fillStyle = act ? '#fff' : 'rgba(255,225,170,.9)';
  ctx.shadowColor = act ? 'rgba(255,170,80,1)' : '#000';
  ctx.shadowBlur = act ? 20 : 6;
  ctx.fillText('GENERAL CHAT', p.x, p.y + R + 18);
  ctx.shadowBlur = 0;

  hits.push({ id: 'core', x: p.x, y: p.y, r: R, z: p.z });
}

function drawMoon(m) {
  const r = m.r;
  const g = ctx.createRadialGradient(m.x - r * 0.3, m.y - r * 0.3, r * 0.1, m.x, m.y, r);
  g.addColorStop(0, '#f4f6ff');
  g.addColorStop(1, '#6a7096');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(m.x, m.y, r, 0, TAU);
  ctx.fill();
}

const TX = new Float32Array(40), TY = new Float32Array(40);
function drawPlanet(c, sp) {
  const prog = clamp((RT - c.born) / 0.9, 0, 1);
  if (prog <= 0) return;
  const sc = easeOutBack(prog);
  const p = c.pj, L = c.lane;
  const sz = c.baseSize * sizeMul;
  const r = Math.max(sz * p.s, 11) * sc;
  const act = selId === c.id, hov = hoverId === c.id;

  let nt = 0;
  TX[0] = p.x; TY[0] = p.y;
  for (let k = 1; k <= 35; k++) {
    lanePt(L, kep(c.M - L.dir * k * 0.05, L.e), LP);
    P(LP[0], LP[1], LP[2]);
    if (PZ < 30) break;
    TX[k] = PX; TY[k] = PY;
    nt = k;
  }
  if (nt > 1) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.strokeStyle = c.color;
    for (let g = 0; g < 7; g++) {
      const a = g * 5, b = Math.min(nt, (g + 1) * 5);
      if (a >= nt) break;
      ctx.globalAlpha = (act ? 0.9 : 0.55) * (1 - g / 7.5) * sc;
      ctx.lineWidth = Math.max(1.5, r * 0.6 * (1 - g / 7));
      ctx.beginPath();
      ctx.moveTo(TX[a], TY[a]);
      for (let k = a + 1; k <= b; k++) ctx.lineTo(TX[k], TY[k]);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  const nm = clamp(Math.floor((c.members || 0) / 2200), 0, 3);
  const moons = [];
  if (r > 9) {
    for (let k = 0; k < nm; k++) {
      const am = T * (1.1 + 0.5 * k) + k * 2.1;
      const rr = sz * (1.9 + 0.8 * k);
      P(c.pos[0] + rr * Math.cos(am), c.pos[1] + rr * 0.35 * Math.sin(am + k), c.pos[2] + rr * Math.sin(am));
      if (PZ > 30) moons.push({ x: PX, y: PY, z: PZ, r: Math.max(2.4, sz * 0.2 * PS) * sc });
    }
  }
  for (const m of moons) if (m.z > p.z) drawMoon(m);

  let lx = sp.x - p.x, ly = sp.y - p.y;
  const Ln = Math.hypot(lx, ly) || 1;
  lx /= Ln; ly /= Ln;

  ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(p.x, p.y, r * 0.8, p.x, p.y, r * 1.35);
  g.addColorStop(0, c.color + '30');
  g.addColorStop(1, c.color + '00');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 1.35, 0, TAU);
  ctx.fill();

  g = ctx.createRadialGradient(p.x, p.y, r * 0.85, p.x, p.y, r * 1.8);
  g.addColorStop(0, c.color + '55');
  g.addColorStop(1, c.color + '00');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 1.8, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, TAU);
  ctx.clip();

  if (c.img.complete && c.img.naturalWidth > 0) {
    ctx.drawImage(c.img, p.x - r, p.y - r, r * 2, r * 2);
  } else {
    ctx.fillStyle = c.color;
    ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
    ctx.font = `bold ${r}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(initials(c.name), p.x, p.y);
  }

  g = ctx.createLinearGradient(p.x + lx * r, p.y + ly * r, p.x - lx * r, p.y - ly * r);
  g.addColorStop(0, 'rgba(0,0,12,0)');
  g.addColorStop(0.45, 'rgba(0,0,12,.18)');
  g.addColorStop(1, 'rgba(0,0,12,.88)');
  ctx.fillStyle = g;
  ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);

  g = ctx.createRadialGradient(p.x + lx * r * 0.45, p.y + ly * r * 0.45, 0, p.x + lx * r * 0.45, p.y + ly * r * 0.45, r * 0.6);
  g.addColorStop(0, 'rgba(255,255,255,.35)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);

  ctx.restore();

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = c.color;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, TAU);
  ctx.stroke();
  ctx.globalAlpha = 1;

  for (const m of moons) if (m.z <= p.z) drawMoon(m);

  if (prog < 1) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (1 - prog) * 0.8;
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 2.5, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  if (act || hov) {
    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.lineDashOffset = -RT * 20;
    ctx.strokeStyle = act ? '#fff' : c.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 1.45, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  if (ALL.length <= 9 || act || hov || r > 17) {
    ctx.font = `700 ${clamp(r * 0.42, 11, 16)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillStyle = act || hov ? '#fff' : 'rgba(225,232,255,.9)';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 8;
    ctx.fillText(c.name, p.x, p.y + r + (act ? 22 : 18));
    ctx.shadowBlur = 0;
  }

  hits.push({ id: c.id, x: p.x, y: p.y, r: r * 1.15, z: p.z });
}

function drawFX(dt) {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.age += dt;
    if (q.age > q.life) { parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
    q.vx *= 0.985; q.vy *= 0.985; q.vz *= 0.985;
    P(q.x, q.y, q.z);
    if (PZ < 40) continue;
    ctx.globalAlpha = 1 - q.age / q.life;
    ctx.fillStyle = q.col;
    const s = Math.max(1.6, 8 * PS);
    ctx.fillRect(PX - s / 2, PY - s / 2, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
  last = now;
  RT = now / 1000;
  if (!paused) T += dt;

  caCam.cy = Math.cos(cam.yaw);
  caCam.sy = Math.sin(cam.yaw);
  caCam.cp = Math.cos(cam.pitch);
  caCam.sp = Math.sin(cam.pitch);

  for (const c of ALL) {
    const L = c.lane;
    if (!L) continue;
    c.off += angd(c.off, c.toff) * Math.min(1, dt * 2.5);
    c.M = c.off + L.dir * T * L.w;
    lanePt(L, kep(c.M, L.e), c.pos);
    if (c.pend && RT >= c.born) { c.pend = false; burst(c); }
  }

  const tgt = (selId && selId !== 'core' && byId[selId]) ? byId[selId].pos : [0, 0, 0];
  const k = 1 - Math.exp(-dt * 5);
  cam.tx += (tgt[0] - cam.tx) * k;
  cam.ty += (tgt[1] - cam.ty) * k;
  cam.tz += (tgt[2] - cam.tz) * k;
  cam.dist += (want.dist - cam.dist) * k;
  cenY += (wantCenY - cenY) * k;

  if (spin && !dragging && now - lastInput > 2500) cam.yaw += dt * 0.1;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  hits.length = 0;

  if (neb) {
    ctx.globalAlpha = 0.9;
    ctx.drawImage(neb, -W * 0.15 + Math.sin(cam.yaw) * 28, -H * 0.15 + cam.pitch * 28, W * 1.3, H * 1.3);
    ctx.globalAlpha = 1;
  }

  drawStarsBg(now / 1000);

  P(0, 0, 0);
  const sp = { x: PX, y: PY, z: PZ, s: PS };

  projBelts();
  drawBelts(true, sp.z);
  drawRings();
  drawWaves();

  const list = [{ z: sp.z, f: () => drawStar(sp, now / 1000) }];
  for (const c of ALL) {
    if (!c.lane) continue;
    P(c.pos[0], c.pos[1], c.pos[2]);
    if (PZ < 40) continue;
    c.pj.x = PX; c.pj.y = PY; c.pj.z = PZ; c.pj.s = PS;
    list.push({ z: PZ, f: () => drawPlanet(c, sp) });
  }
  list.sort((a, b) => b.z - a.z);
  for (const o of list) o.f();

  drawBelts(false, sp.z);
  drawFX(dt);

  requestAnimationFrame(frame);
}

function hitAt(x, y) {
  let best = null;
  for (const h of hits) {
    if (Math.hypot(h.x - x, h.y - y) <= h.r + 10 && (!best || h.z < best.z)) best = h;
  }
  return best;
}
function pd() {
  const a = [...ptrs.values()];
  return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
}

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
  lastInput = performance.now();
  dragging = true;
  if (ptrs.size === 2) pinch0 = pd();
  cv.classList.add('drag');
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) {
    const h = hitAt(e.clientX, e.clientY);
    hoverId = h ? h.id : null;
    cv.classList.toggle('hit', !!h);
    return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  lastInput = performance.now();
  if (ptrs.size === 1) {
    cam.yaw += dx * 0.006;
    cam.pitch = clamp(cam.pitch + dy * 0.006, -1.5, 1.5);
    if (down) down.moved += Math.abs(dx) + Math.abs(dy);
  } else if (ptrs.size === 2) {
    const d = pd();
    if (pinch0) want.dist = cam.dist = clamp(cam.dist * pinch0 / d, 260, defDist() * 2.4);
    pinch0 = d;
    if (down) down.moved += 99;
  }
});
function up(e) {
  const had = ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch0 = 0;
  if (had && ptrs.size === 0) {
    dragging = false;
    cv.classList.remove('drag');
    if (down && down.moved < 8 && performance.now() - down.t < 500) {
      const h = hitAt(e.clientX, e.clientY);
      select(h ? h.id : null);
    }
    down = null;
  }
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  want.dist = clamp(want.dist * Math.exp(e.deltaY * 0.0012), 260, defDist() * 2.4);
  lastInput = performance.now();
}, { passive: false });

   8. UI HELPERS
   ═══════════════════════════════════════════════════════════════ */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === 'class') e.className = props[k];
    else if (k === 'style') e.style.cssText = props[k];
    else if (k.startsWith('on')) e[k] = props[k];
    else e.setAttribute(k, props[k]);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}

async function openChat(roomId, roomName, roomColor, ca) {
  const reqId = ++chatReqId;
  currentRoomId = roomId;
  sheet.style.setProperty('--c', roomColor);

  if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
  if (currentStatsTimer) { clearInterval(currentStatsTimer); currentStatsTimer = null; }

  const isGeneral = roomId === GENERAL_ROOM;
  const cObj = ALL.find(c => c.id === roomId);
  const isAdmin = walletAddress === ADMIN_WALLET;
  const needsVerify = !isGeneral && !!ca;

  const actions = [];
  if (!isGeneral && ca) {
    actions.push(h('button', {
      class: 'icon-btn',
      title: 'Copy token CA',
      onclick: () => navigator.clipboard.writeText(ca).then(
        () => showToast('Token CA copied 📋'),
        () => showToast('Failed to copy', true)
      )
    }, '📋'));
  }
  if (isAdmin && !isGeneral) {
    actions.push(h('button', {
      class: 'icon-btn danger',
      title: 'Delete planet',
      onclick: () => showConfirm('Delete this planet and all its messages? This cannot be undone.', async () => {
        const { error } = await sb.from('orbit_communities').delete().eq('id', roomId);
        if (error) showToast('Error deleting: ' + error.message, true);
        else {
          showToast('Planet destroyed 💥');
          select(null);
          await refreshCommunities();
        }
      })
    }, '🗑'));
  }
  actions.push(h('button', { class: 'x', onclick: () => select(null) }, '×'));

  let statsEl = null;
  if (needsVerify) statsEl = h('div', { class: 'head-stats' });

  const avatarEl = isGeneral
    ? h('div', {
        class: 'av',
        style: 'background:radial-gradient(circle at 35% 35%,#fffbe6,#ffb347 55%,#ff7a2a);display:grid;place-items:center;font-size:24px'
      }, '✦')
    : h('img', { src: cObj.src, alt: roomName });

  const textKids = [
    h('div', { class: 'head-top' },
      h('h2', null, roomName),
      h('div', { class: 'head-actions' }, ...actions)
    ),
    h('p', { class: 'head-meta' }, isGeneral ? 'General Broadcast · open to everyone' : (cObj?.tag || 'Community'))
  ];
  if (statsEl) textKids.push(statsEl);

  const headEl = h('div', { class: 'head' }, avatarEl, h('div', { class: 't' }, ...textKids));

  if (statsEl && ca) {
    renderTokenStats(roomId, ca, statsEl);
    currentStatsTimer = setInterval(() => {
      if (currentRoomId === roomId && statsEl.isConnected) {
        renderTokenStats(roomId, ca, statsEl);
      }
    }, 60000);
  }

  const feed = h('div', { class: 'feed' }, h('div', { class: 'loading' }, 'Connecting…'));
  const feedWrap = h('div', { class: 'feed-wrap' }, feed);
  const jumpBtn = h('button', {
    class: 'jump-btn',
    onclick: () => { feed.scrollTop = feed.scrollHeight; }
  }, '↓');
  feedWrap.append(jumpBtn);

  feed.addEventListener('scroll', () => {
    const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
    jumpBtn.classList.toggle('show', !nearBottom);
  });

  currentChannel = sb.channel('room_' + roomId)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'orbit_messages',
      filter: `community_id=eq.${roomId}`
    }, payload => {
      if (payload.new.community_id !== currentRoomId) return;
      const loader = feed.querySelector('.loading');
      if (loader) loader.remove();
      feed.append(makeMsgEl(payload.new, payload.new.username === myUsername));
      const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 200;
      if (nearBottom) feed.scrollTop = feed.scrollHeight;
      else jumpBtn.classList.add('show');
    })
    .subscribe();

  const input = h('input', {
    placeholder: `Message #${roomName}…`,
    maxlength: '200',
    autocomplete: 'off'
  });
  const charCount = h('span', { class: 'char-count' }, '0/200');
  input.addEventListener('input', () => {
    charCount.textContent = input.value.length + '/200';
  });

  const sendBtn = h('button', null, 'Send');

  const retryBtn = h('button', {
    style: 'display:none;background:linear-gradient(135deg,var(--c),#ffd27a);border:0;border-radius:12px;color:#0a0b16;font:800 12px system-ui;padding:0 14px;cursor:pointer;white-space:nowrap;flex-shrink:0;',
    onclick: () => {
      retryBtn.style.display = 'none';
      input.disabled = true;
      input.placeholder = 'Retrying…';
      runBalanceCheck();
    }
  }, '↻ Retry');

  if (needsVerify) {
    input.disabled = true;
    input.placeholder = walletAddress
      ? 'Verifying token balance…'
      : 'Connect Phantom to verify holdings.';
  }

  const send = async () => {
    const txt = input.value.trim();
    if (!txt || input.disabled) return;
    input.value = '';
    charCount.textContent = '0/200';
    sendBtn.disabled = true;

    const { data: rpcData, error } = await sb.rpc('orbit_send_message', {
      p_room_id: roomId,
      p_wallet: walletAddress || 'guest',
      p_username: myUsername,
      p_content: txt
    });

    sendBtn.disabled = false;

    if (error || (rpcData && rpcData.error === 'insufficient_token_balance')) {
      showToast('Message blocked: insufficient token balance.', true);
      input.value = txt;
    }
  };
  input.onkeydown = e => { if (e.key === 'Enter') send(); };
  sendBtn.onclick = send;

  sheet.innerHTML = '';
  sheet.append(
    h('div', { class: 'grab' }),
    headEl,
    feedWrap,
    h('div', { class: 'compose' },
      h('div', { class: 'compose-wrap' }, input, charCount),
      sendBtn,
      retryBtn
    )
  );
  setTimeout(() => { feed.scrollTop = feed.scrollHeight; }, 60);

  const { data } = await sb.from('orbit_messages')
    .select('*')
    .eq('community_id', roomId)
    .order('created_at', { ascending: true })
    .limit(120);

  if (reqId !== chatReqId) return;

  feed.innerHTML = '';
  if (data && data.length) {
    data.forEach(m => feed.append(makeMsgEl(m, m.username === myUsername)));
  } else {
    feed.append(h('div', { class: 'loading' }, 'Quiet orbit. Be the first to post.'));
  }
  feed.scrollTop = feed.scrollHeight;

  async function runBalanceCheck() {
    if (!walletAddress) {
      input.disabled = true;
      input.placeholder = 'Connect Phantom to verify holdings.';
      return;
    }
    try {
      const balance = await fetchTokenBalance(walletAddress, ca);
      if (reqId !== chatReqId) return;
      if (currentRoomId !== roomId) return;
      if (!input.isConnected) return;

      if (balance > 0) {
        input.disabled = false;
        input.placeholder = `Message #${roomName}…`;
        sb.rpc('orbit_sync_balance', {
          p_wallet: walletAddress, p_room_id: roomId, p_balance: balance
        }).catch(err => console.warn('[ORBITS] balance sync failed:', err.message));
      } else {
        input.disabled = true;
        input.placeholder = "You don't hold this token.";
      }
    } catch (e) {
      if (reqId !== chatReqId) return;
      if (currentRoomId !== roomId) return;
      if (!input.isConnected) return;

      console.warn('[ORBITS] balance check failed:', e.message);
      input.disabled = true;
      const short = e.message.length > 40 ? e.message.slice(0, 40) + '…' : e.message;
      input.placeholder = 'Balance check failed: ' + short;
      retryBtn.style.display = '';
    }
  }

  if (needsVerify) runBalanceCheck();
}

/* ═══════════════════════════════════════════════════════════════
   11. SELECTION
   ═══════════════════════════════════════════════════════════════ */
function select(id) {
  selId = id;
  want.dist = id === 'core' ? 820 : id ? 400 : defDist();
  wantCenY = id ? H * 0.25 : H * 0.5;
  dock.classList.toggle('hide', !!id);

  if (!id) {
    currentRoomId = null;
    sheet.classList.remove('open');
    if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
    if (currentStatsTimer) { clearInterval(currentStatsTimer); currentStatsTimer = null; }
    waves.push({ t0: RT, color: '#ffb347' });
    return;
  }

  sheet.classList.add('open');

  if (id === 'core') {
    openChat(GENERAL_ROOM, 'General Chat', '#ffb347');
  } else {
    const room = ALL.find(c => c.id === id);
    if (room) openChat(room.id, room.name, room.color, room.ca);
  }
}

/* ═══════════════════════════════════════════════════════════════
   12. CONFIRM MODAL
   ═══════════════════════════════════════════════════════════════ */
const confirmModal = $('confirmModal');
const confirmMsg = $('confirmMessage');
let confirmAction = null;

function showConfirm(msg, onConfirm) {
  confirmMsg.textContent = msg;
  confirmAction = onConfirm;
  confirmModal.classList.add('open');
}
function closeConfirm() {
  confirmModal.classList.remove('open');
  confirmAction = null;
}
$('confirmYesBtn').onclick = () => { if (confirmAction) confirmAction(); closeConfirm(); };
$('confirmCancelBtn').onclick = closeConfirm;
$('confirmCloseBtn').onclick = closeConfirm;
confirmModal.onclick = e => { if (e.target === confirmModal) closeConfirm(); };

/* ═══════════════════════════════════════════════════════════════
   13. NEW WORLD MODAL
   ═══════════════════════════════════════════════════════════════ */
const modal = $('modal');
const caInput = $('caInput');
const createBtn = $('createBtn');

$('modalCloseBtn').onclick = () => { modal.classList.remove('open'); caInput.value = ''; };
modal.onclick = e => { if (e.target === modal) { modal.classList.remove('open'); caInput.value = ''; } };

createBtn.onclick = async () => {
  const ca = caInput.value.trim();
  if (!ca || ca.length < 30) { showToast('Invalid CA', true); return; }

  createBtn.disabled = true;
  createBtn.textContent = 'SCANNING BLOCKCHAIN…';

  try {
    const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${ca}`);
    const json = await res.json();
    const pairs = json.pairs || [];
    if (!pairs.length) throw new Error('Token not found on DexScreener');

    pairs.sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
    const pair = pairs[0];

    const name = pair.baseToken?.name || 'Unknown';
    const symbol = pair.baseToken?.symbol || 'TOKEN';
    const logo = pair.info?.imageUrl || '';
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];

    const { error } = await sb.from('orbit_communities').insert({
      name, tagline: symbol, ca, logo_url: logo, color, emoji: '🪐'
    });
    if (error) throw error;

    modal.classList.remove('open');
    caInput.value = '';
    showToast('Planet launched 🚀');
    waves.push({ t0: RT, color });

    await refreshCommunities();
  } catch (err) {
    showToast('Error: ' + err.message, true);
  } finally {
    createBtn.disabled = false;
    createBtn.textContent = 'Launch Planet';
  }
};

/* ═══════════════════════════════════════════════════════════════
   14. REFRESH & BOOT
   ═══════════════════════════════════════════════════════════════ */
async function refreshCommunities() {
  const oldDist = want.dist;
  const oldYaw = cam.yaw;
  const oldPitch = cam.pitch;

  try {
    await syncAll();
    layout();
    buildDock();
    want.dist = oldDist;
    cam.yaw = oldYaw;
    cam.pitch = oldPitch;
  } catch (e) {
    console.warn('Could not refresh communities:', e);
  }
}

async function initApp() {
  if (!W) resize();

  initPresence();

  const temp = [
    { id: 't1', name: 'Loading…', tag: '', color: '#ff7a3d', emoji: '🪐', members: 5000 },
    { id: 't2', name: 'Loading…', tag: '', color: '#b45cff', emoji: '🌍', members: 2000 },
    { id: 't3', name: 'Loading…', tag: '', color: '#3aa0ff', emoji: '🌙', members: 800 },
    { id: 't4', name: 'Loading…', tag: '', color: '#3ddc84', emoji: '☄️', members: 300 }
  ];
  ALL = temp.map(p => hyd(p));
  layout();

  cenY = wantCenY;
  want.dist = defDist();
  cam.dist = defDist() * 1.5;

  try {
    await syncAll();
  } catch (e) {
    console.warn('Could not fetch communities from Supabase:', e);
  }

  layout();
  buildDock();

  setTimeout(() => document.body.classList.remove('booting'), 350);
}

requestAnimationFrame(frame);
initApp();
</script>
</body>
