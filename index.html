let currentRoomId = null;
let currentChannel = null;
let currentAccessChannel = null;
let currentStatsTimer = null;
let chatReqId = 0;

function makeMsgEl(m, isMine) {
  return h('div', { class: 'msg' + (isMine ? ' mine' : '') },
    h('div', { class: 'msg-av', style: `background:${hashColor(m.username || '?')}` }, initials(m.username || '?')),
    h('div', { class: 'msg-body' },
      h('div', { class: 'msg-head' },
               h('b', null, m.sol_name || m.username || shortAddr(m.wallet)),
        h('span', null, relTime(m.created_at))
      ),
      h('p', null, m.content)
    )
  );
}

async function openChat(roomId, roomName, roomColor, ca) {
  const reqId = ++chatReqId;
  currentRoomId = roomId;
  sheet.style.setProperty('--c', roomColor);

  if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
  if (currentAccessChannel) { sb.removeChannel(currentAccessChannel); currentAccessChannel = null; }
  if (currentStatsTimer) { clearInterval(currentStatsTimer); currentStatsTimer = null; }

  const isGeneral = roomId === GENERAL_ROOM;
  if (isGeneral) hideEcoBanner(); else refreshBanner();
  const cObj = ALL.find(c => c.id === roomId);
  const isAdmin = walletAddress === ADMIN_WALLET;
  const needsVerify = !isGeneral && !!ca;

  const actions = [];
  if (!isGeneral && ca) {
    actions.push(h('button', {
      class: 'icon-btn', title: 'Trade token',
      onclick: () => window.Jupiter.init({
        displayMode: 'modal',
        endpoint: HELIUS_RPC,
        formProps: { initialOutputMint: ca }
      })
    }, '⇄'));
  }
  if (isAdmin && !isGeneral) {
    actions.push(h('button', {
      class: 'icon-btn danger', title: 'Delete planet',
      onclick: () => showConfirm('Delete this planet and all its messages? This cannot be undone.', async () => {
        const { error, count } = await sb.from('orbit_communities')
          .delete({ count: 'exact' })
          .eq('id', roomId);
        if (error) {
          showToast('Error deleting: ' + error.message, true);
        } else if (!count) {
          showToast('Delete blocked — check RLS on orbit_communities', true);
        } else {
          showToast('Planet destroyed 💥');
          select(null);
          await refreshCommunities();
          refreshBanner();
        }
      })
    }, '🗑'));
  }
  actions.push(h('button', { class: 'x', onclick: () => select(null) }, '×'));

  let statsEl = null;
  if (needsVerify) statsEl = h('div', { class: 'head-stats' });

  const avatarEl = isGeneral
    ? h('div', {
        class: 'av',
        style: 'background:radial-gradient(circle at 35% 35%,#fffbe6,#ffb347 55%,#ff7a2a);display:grid;place-items:center;font-size:24px'
      }, '✦')
    : h('img', { src: cObj.src, alt: roomName });

  const textKids = [
    h('div', { class: 'head-top' },
      h('h2', null, roomName),
      h('div', { class: 'head-actions' }, ...actions)
    ),
    h('p', { class: 'head-meta' }, isGeneral ? 'General Broadcast · open to everyone' : (cObj?.tag || 'Community'))
  ];
  if (statsEl) textKids.push(statsEl);

  const headEl = h('div', { class: 'head' }, avatarEl, h('div', { class: 't' }, ...textKids));

  if (statsEl && ca) {
    renderTokenStats(roomId, ca, statsEl, cObj?.ecoKey);
    currentStatsTimer = setInterval(() => {
      if (currentRoomId === roomId && statsEl.isConnected) {
        renderTokenStats(roomId, ca, statsEl, cObj?.ecoKey);
      }
    }, 60000);
  }

  const feed = h('div', { class: 'feed' }, h('div', { class: 'loading' }, 'Connecting…'));
  const feedWrap = h('div', { class: 'feed-wrap' }, feed);
  const jumpBtn = h('button', { class: 'jump-btn', onclick: () => { feed.scrollTop = feed.scrollHeight; } }, '↓');
  feedWrap.append(jumpBtn);

  feed.addEventListener('scroll', () => {
    const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
    jumpBtn.classList.toggle('show', !nearBottom);
  });

  await sb.realtime.setAuth();
  currentChannel = sb.channel(`room:${roomId}:messages`, { config: { private: true } })
    .on('broadcast', { event: 'INSERT' }, (payload) => {
      const m = payload.payload?.record ?? payload.payload;
      if (!m || m.community_id !== currentRoomId) return;
      const loader = feed.querySelector('.loading');
      if (loader) loader.remove();
      feed.append(makeMsgEl(m, m.wallet && walletAddress && m.wallet === walletAddress));
      const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 200;
      if (nearBottom) feed.scrollTop = feed.scrollHeight;
      else jumpBtn.classList.add('show');
    })
    .subscribe();

  const input = h('input', {
    placeholder: `Message #${roomName}…`,
    maxlength: '200', autocomplete: 'off'
  });
  const charCount = h('span', { class: 'char-count' }, '0/200');
  input.addEventListener('input', () => {
    charCount.textContent = input.value.length + '/200';
  });

  const sendBtn = h('button', null, 'Send');

  if (needsVerify) {
    input.disabled = true;
    input.placeholder = walletAddress ? 'Checking access…' : 'Connect a wallet to verify holdings.';
  }
  const send = async () => {
    const txt = input.value.trim();
    if (!txt || input.disabled) return;
    input.value = '';
    charCount.textContent = '0/200';
    sendBtn.disabled = true;

    const { data: rpcData, error } = await sb.rpc('orbit_send_message', {
      p_room_id: roomId,
      p_wallet: walletAddress || 'guest',
      p_username: solName || (walletAddress ? shortAddr(walletAddress) : myUsername),
      p_content: txt
    });

    sendBtn.disabled = false;

    if (error || (rpcData && rpcData.error === 'insufficient_token_balance')) {
      showToast('Message blocked: insufficient token balance.', true);
      input.value = txt;
    }
  };
  input.onkeydown = e => { if (e.key === 'Enter') send(); };
  sendBtn.onclick = send;

  sheet.innerHTML = '';
  sheet.append(
    h('div', { class: 'grab' }),
    headEl,
    feedWrap,
    h('div', { class: 'compose' },
      h('div', { class: 'compose-wrap' }, input, charCount),
      sendBtn
    )
  );
  setTimeout(() => { feed.scrollTop = feed.scrollHeight; }, 60);

  const { data } = await sb.from('orbit_messages')
    .select('*')
    .eq('community_id', roomId)
    .order('created_at', { ascending: true })
    .limit(120);

  if (reqId !== chatReqId) return;

  feed.innerHTML = '';
  if (data && data.length) {
    data.forEach(m => feed.append(makeMsgEl(m, m.wallet && walletAddress && m.wallet === walletAddress)));
  } else {
    feed.append(h('div', { class: 'loading' }, 'Quiet orbit. Be the first to post.'));
  }
  feed.scrollTop = feed.scrollHeight;

  if (needsVerify && walletAddress) {
    const { data: row } = await sb.from('room_access')
      .select('status').eq('room_id', roomId).eq('wallet', walletAddress).maybeSingle();

        if (row) {
      const granted = row.status === 'granted';
      input.disabled = !granted;
      input.placeholder = granted ? `Message #${roomName}…` : "You don't hold this token.";
    } else {
      const { data: res } = await sb.functions.invoke('check_access', { body: { wallet: walletAddress, room_id: roomId, ca } });
      if (res && res.status) {
        const granted = res.status === 'granted';
        input.disabled = !granted;
        input.placeholder = granted ? `Message #${roomName}…` : "You don't hold this token.";
      }
    }

    await sb.realtime.setAuth();
    currentAccessChannel = sb.channel(`access:${roomId}`, { config: { private: true } })
      .on('broadcast', { event: 'INSERT' }, (p) => {
        const d = p.payload?.record ?? p.payload;
        if (!d || d.wallet !== walletAddress) return;
        const granted = d.status === 'granted';
        input.disabled = !granted;
        input.placeholder = granted ? `Message #${roomName}…` : "You don't hold this token.";
      })
      .on('broadcast', { event: 'UPDATE' }, (p) => {
        const d = p.payload?.record ?? p.payload;
        if (!d || d.wallet !== walletAddress) return;
        const granted = d.status === 'granted';
        input.disabled = !granted;
        input.placeholder = granted ? `Message #${roomName}…` : "You don't hold this token.";
      })
      .subscribe();
  }
}

/* ═══════════════════════════════════════════════════════════════
   11. SELECTION — empty click no longer removes the eco banner
   ═══════════════════════════════════════════════════════════════ */
function select(id) {
  const eco = ECOSYSTEMS.find(e => e.key === id);
  if (eco) {
    const cur = BODIES.find(b => b.isCenter);
    if (cur && cur.key !== id) swapCenterTo(id);
    return;
  }

  const prevSel = selId;               // captured before overwrite

  // Swap to whichever eco the planet belongs to (null → Solana)
  if (id && id !== 'core') {
    const room = ALL.find(c => c.id === id);
    const targetEco = (room && room.ecoKey) || 'sol';
    const cur = BODIES.find(b => b.isCenter);
    if (cur && cur.key !== targetEco) swapCenterTo(targetEco);
  }

  // Empty click OR chat selection. Do NOT touch the eco banner.
  // The banner persists while an eco is centered.
  selId = id;
  want.dist = id === 'core' ? 820 : id ? 400 : defDist();
  wantCenY = id ? H * 0.25 : H * 0.5;
  dock.classList.toggle('hide', !!id);

     if (!id) {
    currentRoomId = null;
    sheet.classList.remove('open');
    if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
    if (currentAccessChannel) { sb.removeChannel(currentAccessChannel); currentAccessChannel = null; }
    if (currentStatsTimer) { clearInterval(currentStatsTimer); currentStatsTimer = null; }

    const prev = prevSel ? byId[prevSel] : null;
    const cB   = BODIES.find(b => b.isCenter);
    const pulseColor = prev ? prev.color
                            : (cB && !cB.isSol ? getEco(cB.key).color : '#14F195');
    waves.push({ t0: RT, color: pulseColor });

    refreshBanner();
    return;
  }

  sheet.classList.add('open');

  if (id === 'core') {
    const cur = BODIES.find(b => b.isCenter);
    let label = 'General Chat';
    let color = '#ffb347';
    if (cur && !cur.isSol) {
      const eco = getEco(cur.key);
      label = eco.name + ' Chat';
      color = eco.color;
    }
    openChat(GENERAL_ROOM, label, color);
   } else {
    const room = ALL.find(c => c.id === id);
    if (room) openChat(room.id, room.name, room.color, room.ca);
    else select(null);
  }
}

/* ═══════════════════════════════════════════════════════════════
   12. CONFIRM MODAL
   ═══════════════════════════════════════════════════════════════ */
const confirmModal = $('confirmModal');
const confirmMsg = $('confirmMessage');
let confirmAction = null;

function showConfirm(msg, onConfirm) {
  confirmMsg.textContent = msg;
  confirmAction = onConfirm;
  confirmModal.classList.add('open');
}
function closeConfirm() {
  confirmModal.classList.remove('open');
  confirmAction = null;
}
$('confirmYesBtn').onclick = () => { if (confirmAction) confirmAction(); closeConfirm(); };
$('confirmCancelBtn').onclick = closeConfirm;
$('confirmCloseBtn').onclick = closeConfirm;
confirmModal.onclick = e => { if (e.target === confirmModal) closeConfirm(); };

/* ═══════════════════════════════════════════════════════════════
   13. NEW WORLD MODAL — auto-routes eco chain CAs to the right eco
   ═══════════════════════════════════════════════════════════════ */
const modal = $('modal');
const caInput = $('caInput');
const createBtn = $('createBtn');

$('modalCloseBtn').onclick = () => { modal.classList.remove('open'); caInput.value = ''; };
modal.onclick = e => { if (e.target === modal) { modal.classList.remove('open'); caInput.value = ''; } };

const EVM_CHAIN_TO_ECO = { ethereum: 'eth', bsc: 'bnb', robinhood: 'rh', avalanche: 'avax' };

createBtn.onclick = async () => {
  const ca = caInput.value.trim();
  if (!ca || ca.length < 30) { showToast('Invalid CA', true); return; }
  createBtn.disabled = true;
  createBtn.textContent = 'SCANNING BLOCKCHAIN…';
  try {
    const { data, error } = await sb.functions.invoke('create_room', { body: { ca } });
    if (error) throw new Error(error.message);
    modal.classList.remove('open');
    caInput.value = '';
    showToast('Planet launched 🚀');
    await refreshCommunities();
    if (data?.room_id) {
      const blink = `${SUPABASE_URL}/functions/v1/action-launch?room=${data.room_id}`;
      navigator.clipboard.writeText(blink).catch(() => {});
      showToast('Launch Blink copied');
    }
  } catch (err) {
    showToast('Error: ' + err.message, true);
  } finally {
    createBtn.disabled = false;
    createBtn.textContent = 'Launch Planet';
  }
};

/* ═══════════════════════════════════════════════════════════════
   14. REFRESH & BOOT
   ═══════════════════════════════════════════════════════════════ */
async function refreshCommunities() {
  const oldDist = want.dist;
  const oldYaw = cam.yaw;
  const oldPitch = cam.pitch;
  const oldCenY = wantCenY;
  try {
            await syncAll();
    layout();
    initBodies();
    buildDock();
    refreshBanner();
    want.dist = oldDist;
    wantCenY = oldCenY;
    cam.yaw = oldYaw;
    cam.pitch = oldPitch;
  } catch (e) {
    console.warn('Could not refresh communities:', e);
  }
}

async function initApp() {
  if (!W) resize();
  initPresence();

  const temp = [
    { id: 't1', name: 'Loading…', tag: '', color: '#ff7a3d', emoji: '🪐', members: 5000 },
    { id: 't2', name: 'Loading…', tag: '', color: '#b45cff', emoji: '🌍', members: 2000 },
    { id: 't3', name: 'Loading…', tag: '', color: '#3aa0ff', emoji: '🌙', members: 800 },
    { id: 't4', name: 'Loading…', tag: '', color: '#3ddc84', emoji: '☄️', members: 300 }
  ];
  ALL = temp.map(p => hyd(p));
  layout();
  initBodies();

  cenY = wantCenY;
  want.dist = defDist();
  cam.dist = defDist() * 1.5;
  try {
    await syncAll();
  } catch (e) {
    console.warn('Could not fetch communities from Supabase:', e);
  }

    // (eco coins now live in orbit_communities; nothing to fetch separately)

  layout();
  initBodies();
  buildDock();

  setTimeout(() => {
    document.body.classList.remove('booting');
    refreshBanner();
  }, 350);
}

requestAnimationFrame(frame);
initApp();
</script>
