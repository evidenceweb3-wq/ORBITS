<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORBIT — Social Universe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
<style>
:root{--ui:#e9ecff;--mut:#8b91b8;--c:#ffb347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ui);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(120% 90% at 50% 40%,#10122b 0%,#070815 55%,#03040a 100%)}

/* ── EPIC LOADING BLUR ── */
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block;transition:filter 2s cubic-bezier(0.16,1,0.3,1),transform 2s cubic-bezier(0.16,1,0.3,1)}
canvas.drag{cursor:grabbing}
canvas.hit{cursor:pointer}
body.booting{cursor:wait}
body.booting canvas{filter:blur(24px) brightness(0.6);transform:scale(1.1);pointer-events:none}
body.booting .top,body.booting .dock{opacity:0;pointer-events:none}

.top{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5;transition:opacity 1.5s ease}
.brand b{font-size:18px;letter-spacing:.32em;font-weight:800;text-shadow:0 0 18px rgba(255,170,80,.6)}
.brand small{display:block;color:var(--mut);font-size:11px;margin-top:4px;letter-spacing:.04em;max-width:190px;line-height:1.35}
.tools{display:flex;gap:6px;pointer-events:auto}
.btn{background:rgba(20,23,48,.72);border:1px solid rgba(255,255,255,.14);color:var(--ui);border-radius:999px;padding:6px 11px;font:600 12px system-ui;backdrop-filter:blur(8px);cursor:pointer;transition:all .2s}
.btn:hover{border-color:#ffd27a;color:#ffd27a}
.btn.connected{border-color:#22c55e;color:#22c55e;box-shadow:0 0 10px rgba(34,197,94,0.3)}
.btn.verified-x{border-color:#1d9bf0;color:#1d9bf0;box-shadow:0 0 10px rgba(29,155,240,0.3)}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:4;scrollbar-width:none;transition:transform .35s,opacity 1.5s ease}
.dock::-webkit-scrollbar{display:none}
.dock.hide{transform:translateY(120%);opacity:0;pointer-events:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;background:rgba(14,17,38,.78);border:1px solid rgba(255,255,255,.14);color:var(--ui);border-radius:999px;padding:5px 12px 5px 5px;font:600 13px system-ui;backdrop-filter:blur(8px);cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--c)}
.chip img{width:26px;height:26px;border-radius:50%;display:block;object-fit:cover}
.chip.core,.chip.add{padding-left:12px;color:#ffd27a;border-color:rgba(255,210,122,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;height:60vh;display:flex;flex-direction:column;background:rgba(9,11,24,.93);backdrop-filter:blur(14px);border-radius:22px 22px 0 0;border:1px solid rgba(255,255,255,.1);border-bottom:0;border-top:2px solid var(--c);box-shadow:0 -10px 40px rgba(0,0,0,.5),0 -2px 30px color-mix(in srgb,var(--c) 35%,transparent);transform:translateY(106%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:6}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:8px auto 2px;flex:none}
.head{display:flex;align-items:center;gap:12px;padding:8px 16px 10px;flex:none}
.head img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent);object-fit:cover}
.head .t{flex:1;min-width:0}
.head h2{margin:0;font-size:18px}
.head p{margin:2px 0 0;color:var(--mut);font-size:12px}
.x{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;padding:0 0 0 4px;transition:color .2s}
.x:hover{color:#ff5c7c}
.compose{display:flex;gap:8px;padding:0 16px 10px;flex:none}
.compose input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--ui);padding:10px 12px;font:14px system-ui;outline:none;width:100%}
.compose input:focus{border-color:var(--c)}
.compose input:disabled{opacity:0.5;cursor:not-allowed}
.compose button{background:var(--c);border:0;border-radius:12px;color:#0a0b16;font:800 13px system-ui;padding:0 16px;cursor:pointer}
.feed{flex:1;overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.msg{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:11px 12px}
.msg .m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-bottom:6px}
.msg .m b{color:var(--ui);font-size:13px}
.msg p{margin:0;font-size:14px;line-height:1.4;word-break:break-word}
.loading{color:var(--mut);font-size:13px;text-align:center;padding:20px}
/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:10;display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.modal-box{background:rgba(14,17,38,.95);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:24px;width:100%;max-width:420px;box-shadow:0 20px 40px rgba(0,0,0,.8), 0 0 30px rgba(255,179,71,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{margin:0;color:#ffd27a;font-size:16px;letter-spacing:.05em}
.modal-x{background:none;border:0;color:var(--mut);font-size:24px;cursor:pointer;padding:0 4px;transition:color .2s}
.modal-x:hover{color:#ff5c7c}
.modal-box input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;padding:12px;font:14px system-ui;margin-bottom:16px;border-radius:12px;outline:none}
.modal-box input:focus{border-color:#ffd27a}
.modal-box button.primary{width:100%;background:#ffd27a;border:0;color:#0a0b16;padding:12px;font:800 14px system-ui;border-radius:12px;cursor:pointer;transition:all .2s}
.modal-box button.primary:hover{filter:brightness(1.1);box-shadow:0 0 15px rgba(255,210,122,.4)}
.modal-box button:disabled{opacity:.5;cursor:not-allowed}
@media(min-width:700px){.sheet{height:50vh;border-radius:22px;bottom:14px;border-bottom:1px solid rgba(255,255,255,.1)}}
</style>
</head>
<body class="booting">
<canvas id="c"></canvas>
<div class="top">
  <div class="brand"><b>ORBIT</b><small id="hint">drag to rotate · pinch to zoom · tap a planet</small></div>
  <div class="tools">
    <button class="btn" id="xBtn">VERIFY X</button>
    <button class="btn" id="phantomBtn">CONNECT PHANTOM</button>
  </div>
</div>
<div class="dock" id="dock"></div>
<div class="sheet" id="sheet"></div>

<!-- MODAL FOR CA CREATION -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
        <h3>Initialize New World</h3>
        <button class="modal-x" id="modalCloseBtn">✕</button>
    </div>
    <input type="text" id="caInput" placeholder="Paste Token CA (Contract Address)..." autocomplete="off">
    <button class="primary" id="createBtn">Launch Planet</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// 0. SUPABASE & AUTH SETUP
// ═══════════════════════════════════════════════════════
const SUPABASE_URL = 'https://lmakgwdrwdhjofgyovkj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_50c1y3L6RfgVDqZPETvUtA_yZQt5our';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let myUsername = localStorage.getItem('orbit_user') || 'Anon';
let walletAddress = null;
let isXVerified = localStorage.getItem('orbit_x_verified') === 'true';

const phantomBtn = document.getElementById('phantomBtn');
const xBtn = document.getElementById('xBtn');

function updateAuthUI() {
    if (walletAddress) {
        phantomBtn.textContent = walletAddress.slice(0,4) + '...' + walletAddress.slice(-4);
        phantomBtn.classList.add('connected');
    } else {
        phantomBtn.textContent = 'CONNECT PHANTOM';
        phantomBtn.classList.remove('connected');
    }
    if (isXVerified) {
        xBtn.textContent = 'X VERIFIED';
        xBtn.classList.add('verified-x');
    } else {
        xBtn.textContent = 'VERIFY X';
        xBtn.classList.remove('verified-x');
    }
}

phantomBtn.onclick = async () => {
    if (!window.solana || !window.solana.isPhantom) {
        alert("Phantom wallet not found! Please install the extension.");
        return;
    }
    try {
        const resp = await window.solana.connect();
        walletAddress = resp.publicKey.toString();
        localStorage.setItem('orbit_wallet', walletAddress);
        updateAuthUI();
        if(myUsername === 'Anon') {
            myUsername = prompt("Wallet connected! Enter your username:") || "Anon" + Math.floor(Math.random()*1000);
            localStorage.setItem('orbit_user', myUsername);
        }
    } catch (err) { console.error(err); }
};

xBtn.onclick = () => {
    if (!walletAddress) { alert("Connect Phantom first!"); return; }
    if (isXVerified) return;
    alert("Redirecting to X for verification... (Mock)");
    setTimeout(() => {
        isXVerified = true;
        localStorage.setItem('orbit_x_verified', 'true');
        updateAuthUI();
    }, 1000);
};

if (localStorage.getItem('orbit_wallet')) {
    walletAddress = localStorage.getItem('orbit_wallet');
    window.solana.connect({ onlyIfTrusted: true }).catch(()=>{});
}
updateAuthUI();

// ═══════════════════════════════════════════════════════
// 1. ORBIT 3D ENGINE
// ═══════════════════════════════════════════════════════
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const COLORS=['#ff7a3d','#ff4d8d','#b45cff','#3aa0ff','#2fd3c4','#3ddc84','#ffd23f','#ff5b5b'];
let RT=performance.now()/1000;
let T=0;

function lighten(hex,a){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.round(v+(255-v)*a);return `rgb(${m(r)},${m(g)},${m(b)})`}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function initials(n){const w=String(n||'').trim().split(/\s+/);return (((w[0]||'?')[0]||'?')+(w[1]?w[1][0]:'')).toUpperCase()}

const HY={};let ALL=[],byId={};

function hyd(d){
  if(HY[d.id])return HY[d.id];
  const c=Object.assign({},d);
  c.src = d.logo_url || 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="${d.color||'#ff7a3d'}"/><text x="50" y="50" dy=".35em" text-anchor="middle" font-family="system-ui" font-weight="800" font-size="40" fill="#fff">${esc(d.emoji||initials(d.name))}</text></svg>`);
  c.img=new Image();c.img.src=c.src;
  c.born=RT+.3;c.pulseAt=-99;c.pos=[0,0,0];c.pj={x:0,y:0,z:1,s:1};c.off=undefined;c.lane=null;
  HY[d.id]=c;return c;
}

async function syncAll(){
  const { data: rooms } = await sb.from('orbit_communities').select('*').neq('id', '00000000-0000-0000-0000-000000000000');
  ALL = (rooms || []).map(r => hyd({ id: r.id, name: r.name, tag: r.tagline, color: r.color, emoji: r.emoji, members: 1, ca: r.ca }));
  byId={};ALL.forEach(c=>byId[c.id]=c);
}

const LANES=[];let BELTS=[],outerR=250,sizeMul=1;
function laneDef(i){
  const r=250+i*92;
  const e=.03+(Math.sin(i*12.9898)*.5+.5)*.09;
  const inc=(i%2?-1:1)*(.06+(Math.sin(i*78.233)*.5+.5)*.24);
  const node=i*2.399963;
  return{idx:i,r,e,b:Math.sqrt(1-e*e),inc,node,ci:Math.cos(inc),si:Math.sin(inc),cn:Math.cos(node),sn:Math.sin(node),w:.34*Math.pow(250/r,1.5),dir:i%2?-1:1,members:[]};
}
function lanePt(L,E,o){
  const x=L.r*(Math.cos(E)-L.e),z0=L.r*L.b*Math.sin(E);
  const y=z0*L.si,z=z0*L.ci;
  o[0]=x*L.cn+z*L.sn;o[1]=y;o[2]=-x*L.sn+z*L.cn;return o;
}
function kep(M,e,it){let E=M;for(let i=0;i<(it||4);i++)E=M+e*Math.sin(E);return E}
function angd(a,b){return((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI}
function g3(){return(Math.random()+Math.random()+Math.random()-1.5)/1.5}
function mkBelt(r,w,th,n,dir){
  const B={r,n,dir,w:.34*Math.pow(250/r,1.5)*.8,cx:new Float32Array(n),sx:new Float32Array(n),rr:new Float32Array(n),yy:new Float32Array(n),bx:new Float32Array(n),by:new Float32Array(n),bz:new Float32Array(n)};
  for(let i=0;i<n;i++){const a=Math.random()*TAU;B.cx[i]=Math.cos(a);B.sx[i]=Math.sin(a);B.rr[i]=r+g3()*w;B.yy[i]=g3()*th}
  return B;
}
function layout(){
  LANES.length=0;
  let i=0,lane=0;
  while(i<ALL.length){
    const cap=1+Math.floor(lane/4);
    const L=laneDef(lane);
    for(let k=0;k<cap&&i<ALL.length;k++)L.members.push(ALL[i++]);
    LANES.push(L);lane++;
  }
  for(const L of LANES)L.members.forEach((c,k)=>{
    c.lane=L;c.toff=k/L.members.length*TAU+L.idx*1.7;
    if(c.off===undefined)c.off=c.toff;
    const base=clamp(30+Math.log10((c.members||1)+10)*6,36,54);
    c.baseSize=base;
  });
  outerR=LANES.length?LANES[LANES.length-1].r*(1+.12):250;
  sizeMul=clamp(Math.pow(outerR/760,.4),1,1.8);
  BELTS=[];
  if(LANES.length>=6)BELTS.push(mkBelt(250+3.5*92,16,8,1000,1));
  BELTS.push(mkBelt(outerR+80,26,12,1500,-1));
}
const defDist=()=>clamp((outerR+110)*2.0,1250,7500);

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,F=400;
const cam={yaw:.6,pitch:.5,dist:3000,tx:0,ty:0,tz:0};
const want={dist:1500};
let cenY=0,wantCenY=0;
const ca={cy:1,sy:0,cp:1,sp:0};
let PX=0,PY=0,PZ=1,PS=1;
function P(x,y,z,noT){
  if(!noT){x-=cam.tx;y-=cam.ty;z-=cam.tz}
  const x1=x*ca.cy-z*ca.sy,z1=x*ca.sy+z*ca.cy;
  const y2=y*ca.cp+z1*ca.sp,z2=-y*ca.sp+z1*ca.cp+cam.dist;
  PS=F/z2;PX=W/2+x1*PS;PY=cenY-y2*PS;PZ=z2;
}

const STARS=[];
for(let i=0;i<560;i++){
  const u=Math.random()*2-1,a=Math.random()*TAU,r=Math.sqrt(1-u*u);
  STARS.push({x:r*Math.cos(a),y:u,z:r*Math.sin(a),s:Math.random()*1.5+.3,p:Math.random()*6.28,c:['#ffffff','#cfe0ff','#ffe9c4','#ffd0e8'][i%4]});
}
let neb=null;
function buildNeb(){
  const w=Math.ceil(W*1.3*.5),h=Math.ceil(H*1.3*.5);
  neb=document.createElement('canvas');neb.width=w;neb.height=h;
  const x=neb.getContext('2d');
  const blobs=[[.22,.28,.55,'#5b2a9e',.30],[.78,.66,.6,'#1b5ea8',.26],[.5,.5,.4,'#a8431b',.12],[.14,.82,.45,'#1b8a6b',.16],[.88,.18,.5,'#8e2a6e',.18]];
  for(const b of blobs){
    const R=Math.max(w,h)*b[2];
    const g=x.createRadialGradient(b[0]*w,b[1]*h,0,b[0]*w,b[1]*h,R);
    g.addColorStop(0,b[3]);g.addColorStop(1,'rgba(0,0,0,0)');
    x.globalAlpha=b[4];x.fillStyle=g;x.fillRect(0,0,w,h);
  }
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  F=Math.min(W,H)*.95;if(W>H)F=Math.min(F,H*.95);
  wantCenY=selId?H*.25:H*.5;if(!cenY)cenY=wantCenY;
  buildNeb();
}
addEventListener('resize',resize);

let paused=false,spin=true,lastInput=0,selId=null,hoverId=null,hits=[];
const waves=[],parts=[];

function burst(c){
  waves.push({t0:RT,color:c.color});
  const q=c.pos;
  for(let i=0;i<46;i++){
    const a=Math.random()*TAU,u=Math.random()*2-1,rr=Math.sqrt(1-u*u),sp=60+Math.random()*170;
    parts.push({x:q[0],y:q[1],z:q[2],vx:rr*Math.cos(a)*sp,vy:u*sp,vz:rr*Math.sin(a)*sp,life:.8+Math.random()*.9,age:0,col:i%3?c.color:'#ffffff'});
  }
}
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}

function drawStarsBg(t){
  for(const s of STARS){
    P(s.x*9000,s.y*9000,s.z*9000,true);
    if(PZ<200||PX<-5||PX>W+5||PY<-5||PY>H+5)continue;
    ctx.globalAlpha=.45+.45*Math.sin(t*1.4+s.p);
    ctx.fillStyle=s.c;ctx.fillRect(PX,PY,s.s,s.s);
  }
  ctx.globalAlpha=1;
}
function projBelts(){
  for(const B of BELTS){
    const ang=B.dir*T*B.w,cr=Math.cos(ang),sr=Math.sin(ang);
    for(let i=0;i<B.n;i++){
      const c0=B.cx[i],s0=B.sx[i],r=B.rr[i];
      P(r*(c0*cr-s0*sr),B.yy[i],r*(s0*cr+c0*sr));
      B.bx[i]=PX;B.by[i]=PY;B.bz[i]=PZ;
    }
  }
}
function drawBelts(front,zs){
  ctx.globalAlpha=.62;
  let k=0;
  for(const B of BELTS){
    ctx.fillStyle=(k++%2)?'#9fb4d8':'#c8b79a';
    for(let i=0;i<B.n;i++){
      const z=B.bz[i];if(z<40)continue;
      if((z<=zs)!==front)continue;
      const s=clamp(F/z*3.2,1,2.4);
      ctx.fillRect(B.bx[i],B.by[i],s,s);
    }
  }
  ctx.globalAlpha=1;
}
const LP=[0,0,0];

function drawRings(){
  ctx.lineWidth=1.2;
  for(const L of LANES){
    let col='rgba(170,185,255,0.25)', al=1;
    let isHover = false;
    
    for(const c of L.members){
      if(selId===c.id){col=c.color; al=0.8; isHover=true; break}
      if(hoverId===c.id){col=c.color; al=0.5; isHover=true}
    }
    
    ctx.strokeStyle=col;
    ctx.globalAlpha=al;
    
    if(!isHover) {
        ctx.setLineDash([2, 6]); 
        ctx.lineDashOffset = -RT * 10;
    } else {
        ctx.setLineDash([6, 6]); 
        ctx.lineDashOffset = -RT * 20;
        ctx.shadowColor = col;
        ctx.shadowBlur = 10;
    }
    
    ctx.beginPath();let pen=false;
    for(let k=0;k<=96;k++){
      lanePt(L,k/96*TAU,LP);P(LP[0],LP[1],LP[2]);
      if(PZ<30){pen=false;continue}
      if(pen)ctx.lineTo(PX,PY);else{ctx.moveTo(PX,PY);pen=true}
    }
    ctx.stroke();
    
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
  }
  ctx.globalAlpha=1;
}

function drawWaves(){
  ctx.globalCompositeOperation='lighter';
  const lim=outerR*1.25+200;
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i],R=(RT-w.t0)*620;
    if(R>lim){waves.splice(i,1);continue}
    ctx.strokeStyle=w.color;ctx.globalAlpha=Math.max(0,.5*(1-R/lim));ctx.lineWidth=2.2;
    ctx.beginPath();let pen=false;
    for(let k=0;k<=72;k++){
      const a=k/72*TAU;P(R*Math.cos(a),0,R*Math.sin(a));
      if(PZ<30){pen=false;continue}
      if(pen)ctx.lineTo(PX,PY);else{ctx.moveTo(PX,PY);pen=true}
    }
    ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
}
function drawStar(p,t){
  const R=Math.max(60*p.s,24); 
  let g=ctx.createRadialGradient(p.x,p.y,R*.5,p.x,p.y,R*5.5);
  g.addColorStop(0,'rgba(255,190,90,.55)');g.addColorStop(.35,'rgba(255,120,40,.16)');g.addColorStop(1,'rgba(255,100,30,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R*5.5,0,7);ctx.fill();
  ctx.save();ctx.translate(p.x,p.y);
  for(let layer=0;layer<2;layer++){
    ctx.save();ctx.rotate((layer?-1:1)*t*(layer?.04:.06));
    const n=layer?8:12;
    for(let i=0;i<n;i++){
      ctx.rotate(TAU/n);
      const L=R*((layer?2.3:1.7)+.4*Math.sin(t*1.7+i*2.1));
      const gg=ctx.createLinearGradient(0,0,L,0);
      gg.addColorStop(0,layer?'rgba(255,170,90,.3)':'rgba(255,225,150,.55)');gg.addColorStop(1,'rgba(255,150,60,0)');
      ctx.fillStyle=gg;ctx.beginPath();ctx.moveTo(0,-R*(layer?.14:.2));ctx.lineTo(L,0);ctx.lineTo(0,R*(layer?.14:.2));ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
  g=ctx.createRadialGradient(p.x-R*.25,p.y-R*.25,R*.1,p.x,p.y,R);
  g.addColorStop(0,'#fffbe6');g.addColorStop(.5,'#ffd36b');g.addColorStop(1,'#ff8a2a');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.fill();
  const q=R*.5;ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();
  ctx.moveTo(p.x,p.y-q);ctx.quadraticCurveTo(p.x,p.y,p.x+q,p.y);ctx.quadraticCurveTo(p.x,p.y,p.x,p.y+q);
  ctx.quadraticCurveTo(p.x,p.y,p.x-q,p.y);ctx.quadraticCurveTo(p.x,p.y,p.x,p.y-q);ctx.fill();
  const act=selId==='core'||hoverId==='core';
  ctx.font=`800 ${clamp(R*.26,10,14)}px system-ui`;ctx.textAlign='center';
  ctx.fillStyle=act?'#fff':'rgba(255,225,170,.9)';ctx.shadowColor='#000';ctx.shadowBlur=6;
  ctx.fillText('GENERAL CHAT',p.x,p.y+R+18);ctx.shadowBlur=0;
  hits.push({id:'core',x:p.x,y:p.y,r:R,z:p.z});
}
const TX=new Float32Array(32),TY=new Float32Array(32);
function drawMoon(m){
  const r=m.r;
  const g=ctx.createRadialGradient(m.x-r*.3,m.y-r*.3,r*.1,m.x,m.y,r);
  g.addColorStop(0,'#f4f6ff');g.addColorStop(1,'#6a7096');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.x,m.y,r,0,7);ctx.fill();
}
function drawPlanet(c,sp){
  const prog=clamp((RT-c.born)/.9,0,1);if(prog<=0)return;
  const sc=easeOutBack(prog),p=c.pj,L=c.lane;
  const sz=c.baseSize*sizeMul;
  const r=Math.max(sz*p.s,11)*sc;
  const act=selId===c.id,hov=hoverId===c.id;
  let nt=0;TX[0]=p.x;TY[0]=p.y;
  for(let k=1;k<=22;k++){
    lanePt(L,kep(c.M-L.dir*k*.05,L.e),LP);P(LP[0],LP[1],LP[2]);
    if(PZ<30)break;TX[k]=PX;TY[k]=PY;nt=k;
  }
  if(nt>1){
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.strokeStyle=c.color;
    for(let g=0;g<5;g++){
      const a=g*4,b=Math.min(nt,(g+1)*4);if(a>=nt)break;
      ctx.globalAlpha=(act?.9:.5)*(1-g/5.2)*sc;ctx.lineWidth=Math.max(1.2,r*.5*(1-g/5));
      ctx.beginPath();ctx.moveTo(TX[a],TY[a]);for(let k=a+1;k<=b;k++)ctx.lineTo(TX[k],TY[k]);ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  }
  const nm=clamp(Math.floor((c.members||0)/2200),0,3),moons=[];
  if(r>9)for(let k=0;k<nm;k++){
    const am=T*(1.1+.5*k)+k*2.1,rr=sz*(1.9+.8*k);
    P(c.pos[0]+rr*Math.cos(am),c.pos[1]+rr*.35*Math.sin(am+k),c.pos[2]+rr*Math.sin(am));
    if(PZ>30)moons.push({x:PX,y:PY,z:PZ,r:Math.max(2.4,sz*.2*PS)*sc});
  }
  for(const m of moons)if(m.z>p.z)drawMoon(m);
  let lx=sp.x-p.x,ly=sp.y-p.y;const Ln=Math.hypot(lx,ly)||1;lx/=Ln;ly/=Ln;
  let g=ctx.createRadialGradient(p.x,p.y,r*.85,p.x,p.y,r*1.7);
  g.addColorStop(0,c.color+'66');g.addColorStop(1,c.color+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*1.7,0,7);ctx.fill();
  g=ctx.createRadialGradient(p.x+lx*r*.35,p.y+ly*r*.35,r*.1,p.x,p.y,r*1.05);
  g.addColorStop(0,lighten(c.color,.55));g.addColorStop(.55,c.color);g.addColorStop(1,'#07081a');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.clip();
  const lr=r*.78;
  if(c.img.complete&&c.img.naturalWidth)ctx.drawImage(c.img,p.x-lr,p.y-lr,lr*2,lr*2);
  g=ctx.createLinearGradient(p.x+lx*r,p.y+ly*r,p.x-lx*r,p.y-ly*r);
  g.addColorStop(0,'rgba(0,0,12,0)');g.addColorStop(.45,'rgba(0,0,12,.08)');g.addColorStop(1,'rgba(0,0,12,.62)');
  ctx.fillStyle=g;ctx.fillRect(p.x-r,p.y-r,r*2,r*2);
  g=ctx.createRadialGradient(p.x+lx*r*.45,p.y+ly*r*.45,0,p.x+lx*r*.45,p.y+ly*r*.45,r*.55);
  g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(p.x-r,p.y-r,r*2,r*2);
  ctx.restore();
  ctx.lineWidth=1.5;ctx.strokeStyle=c.color;ctx.globalAlpha=.8;
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();ctx.globalAlpha=1;
  for(const m of moons)if(m.z<=p.z)drawMoon(m);
  if(prog<1){
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-prog)*.7;ctx.fillStyle=c.color;
    ctx.beginPath();ctx.arc(p.x,p.y,r*2.2,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  }
  const age=RT-c.pulseAt;
  if(age<1.4){
    ctx.strokeStyle=c.color;ctx.globalAlpha=1-age/1.4;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p.x,p.y,r*(1.2+age*2.2),0,7);ctx.stroke();ctx.globalAlpha=1;
  }
  if(act||hov){
    ctx.save();ctx.setLineDash([6,6]);ctx.lineDashOffset=-RT*18;ctx.strokeStyle=act?'#fff':c.color;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(p.x,p.y,r*1.38,0,7);ctx.stroke();ctx.restore();
  }
  if(ALL.length<=9||act||hov||r>17){
    ctx.font=`700 ${clamp(r*.42,11,15)}px system-ui`;ctx.textAlign='center';
    ctx.fillStyle=act||hov?'#fff':'rgba(225,232,255,.88)';ctx.shadowColor='#000';ctx.shadowBlur=6;
    ctx.fillText(c.name,p.x,p.y+r+(act?20:15));ctx.shadowBlur=0;
  }
  hits.push({id:c.id,x:p.x,y:p.y,r:r*1.1,z:p.z});
}
function drawFX(dt){
  ctx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.age+=dt;
    if(q.age>q.life){parts.splice(i,1);continue}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vx*=.985;q.vy*=.985;q.vz*=.985;
    P(q.x,q.y,q.z);if(PZ<40)continue;
    ctx.globalAlpha=1-q.age/q.life;ctx.fillStyle=q.col;
    const s=Math.max(1.6,8*PS);ctx.fillRect(PX-s/2,PY-s/2,s,s);
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;RT=now/1000;
  if(!paused)T+=dt;
  ca.cy=Math.cos(cam.yaw);ca.sy=Math.sin(cam.yaw);ca.cp=Math.cos(cam.pitch);ca.sp=Math.sin(cam.pitch);
  for(const c of ALL){
    const L=c.lane;if(!L)continue;
    c.off+=angd(c.off,c.toff)*Math.min(1,dt*2.5);
    c.M=c.off+L.dir*T*L.w;
    lanePt(L,kep(c.M,L.e),c.pos);
    if(c.pend&&RT>=c.born){c.pend=false;burst(c)}
  }
  const tgt=(selId&&selId!=='core'&&byId[selId])?byId[selId].pos:[0,0,0];
  const k=1-Math.exp(-dt*5);
  cam.tx+=(tgt[0]-cam.tx)*k;cam.ty+=(tgt[1]-cam.ty)*k;cam.tz+=(tgt[2]-cam.tz)*k;
  cam.dist+=(want.dist-cam.dist)*k;cenY+=(wantCenY-cenY)*k;
  if(spin&&!dragging&&now-lastInput>2500)cam.yaw+=dt*.1;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);hits=[];
  if(neb){ctx.globalAlpha=.9;ctx.drawImage(neb,-W*.15+Math.sin(cam.yaw)*28,-H*.15+cam.pitch*28,W*1.3,H*1.3);ctx.globalAlpha=1}
  drawStarsBg(now/1000);
  P(0,0,0);const sp={x:PX,y:PY,z:PZ,s:PS};
  projBelts();
  drawBelts(true,sp.z);
  drawRings();drawWaves();
  const list=[{z:sp.z,f:()=>drawStar(sp,now/1000)}];
  for(const c of ALL){
    if(!c.lane)continue;
    P(c.pos[0],c.pos[1],c.pos[2]);
    if(PZ<40)continue;
    c.pj.x=PX;c.pj.y=PY;c.pj.z=PZ;c.pj.s=PS;
    list.push({z:PZ,f:()=>drawPlanet(c,sp)});
  }
  list.sort((a,b)=>b.z-a.z);
  for(const o of list)o.f();
  drawBelts(false,sp.z);
  drawFX(dt);
  requestAnimationFrame(frame);
}

let dragging=false,down=null,pinch0=0;const ptrs=new Map();
const pd=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
function hitAt(x,y){
  let best=null;
  for(const h of hits){if(Math.hypot(h.x-x,h.y-y)<=h.r+8&&(!best||h.z<best.z))best=h}
  return best;
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};lastInput=performance.now();dragging=true;
  if(ptrs.size===2)pinch0=pd();cv.classList.add('drag');
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){const h=hitAt(e.clientX,e.clientY);hoverId=h?h.id:null;cv.classList.toggle('hit',!!h);return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;lastInput=performance.now();
  if(ptrs.size===1){cam.yaw+=dx*.006;cam.pitch=clamp(cam.pitch+dy*.006,-1.5,1.5);if(down)down.moved+=Math.abs(dx)+Math.abs(dy)}
  else if(ptrs.size===2){const d=pd();if(pinch0){want.dist=cam.dist=clamp(cam.dist*pinch0/d,260,defDist()*2.4)}pinch0=d;if(down)down.moved+=99}
});
function up(e){
  const had=ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;
  if(had&&ptrs.size===0){
    dragging=false;cv.classList.remove('drag');
    if(down&&down.moved<8&&performance.now()-down.t<500){const h=hitAt(e.clientX,e.clientY);select(h?h.id:null)}
    down=null;
  }
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();want.dist=clamp(want.dist*Math.exp(e.deltaY*.0012),260,defDist()*2.4);lastInput=performance.now()},{passive:false});

// ═══════════════════════════════════════════════════════
// 2. UI & CHAT LOGIC
// ═══════════════════════════════════════════════════════
const sheet=document.getElementById('sheet'),dock=document.getElementById('dock');
const modal=document.getElementById('modal'), caInput=document.getElementById('caInput'), createBtn=document.getElementById('createBtn'), modalCloseBtn=document.getElementById('modalCloseBtn');
let currentRoomId=null, currentChannel=null;

function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){
    if(k==='class')e.className=props[k];else if(k==='style')e.style.cssText=props[k];
    else if(k.startsWith('on'))e[k]=props[k];else e.setAttribute(k,props[k]);
  }
  for(const kid of kids.flat()){if(kid==null)continue;e.append(kid.nodeType?kid:document.createTextNode(kid))}
  return e;
}
const rel=(ts)=>{const m=Math.max(1,Math.round((Date.now()-new Date(ts).getTime())/60000));return m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'};

function buildDock(){
  dock.innerHTML='';
  dock.append(h('button',{class:'chip core',onclick:()=>select('core')},'✦ General'));
  dock.append(h('button',{class:'chip add',onclick:()=>modal.classList.add('open')},'＋ New World'));
  ALL.forEach(c=>dock.append(h('button',{class:'chip',onclick:()=>select(c.id)},h('img',{src:c.src,alt:c.name}),c.name)));
}

async function openChat(roomId, roomName, roomColor, ca){
  currentRoomId = roomId;
  sheet.style.setProperty('--c', roomColor);
  
  const feed = h('div',{class:'feed'}, h('div',{class:'loading'},'Connecting to network...'));
  
  if(currentChannel) sb.removeChannel(currentChannel);
  currentChannel = sb.channel('room_'+roomId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orbit_messages', filter: `community_id=eq.${roomId}` }, payload => {
        if(payload.new.community_id === currentRoomId) {
            const loader = feed.querySelector('.loading');
            if(loader) loader.remove();
            feed.append(h('div',{class:'msg'},
                h('div',{class:'m'}, h('b',null,payload.new.username), '· '+rel(payload.new.created_at)),
                h('p',null,payload.new.content)
            ));
            feed.scrollTop = feed.scrollHeight;
        }
    }).subscribe();

  const { data } = await sb.from('orbit_messages').select('*').eq('community_id', roomId).order('created_at', {ascending:true}).limit(100);
  feed.innerHTML = '';
  if(data && data.length) {
      data.forEach(m => {
          feed.append(h('div',{class:'msg'},
              h('div',{class:'m'}, h('b',null,m.username), '· '+rel(m.created_at)),
              h('p',null,m.content)
          ));
      });
  } else {
      feed.append(h('div',{class:'loading'},'Quiet orbit. Be the first to post.'));
  }

  const isGeneral = roomId === '00000000-0000-0000-0000-000000000000';
  const input = h('input',{placeholder:`Message #${roomName}...`, maxlength:'200'});
  
  if (!isGeneral && ca) {
      if (!walletAddress) {
          input.disabled = true;
          input.placeholder = "Connect Phantom to verify holdings.";
      } else {
          try {
              input.disabled = true; input.placeholder = "Verifying token balance...";
              
              const connection = new solanaWeb3.Connection("https://mainnet.helius-rpc.com/?api-key=fa7e6515-19de-45de-a7d1-35a64a0d9a1a");
              const pubKey = new solanaWeb3.PublicKey(walletAddress);
              const mint = new solanaWeb3.PublicKey(ca);
              
              const accounts = await connection.getParsedTokenAccountsByOwner(pubKey, { mint: mint });
              let balance = 0;
              accounts.value.forEach(acc => {
                  balance += acc.account.data.parsed.info.tokenAmount.uiAmount;
              });
              
              await sb.rpc('orbit_sync_balance', { p_wallet: walletAddress, p_room_id: roomId, p_balance: balance });
              
              if (balance > 0) {
                  input.disabled = false;
                  input.placeholder = `Message #${roomName}...`;
              } else {
                  input.placeholder = "You don't hold this token.";
                  input.disabled = true;
              }
          } catch(e) {
              console.error(e);
              input.placeholder = "Error checking balance.";
              input.disabled = true;
          }
      }
  }

  const send = async () => {
      const txt = input.value.trim(); if(!txt) return; input.value='';
      
      const { data, error } = await sb.rpc('orbit_send_message', {
          p_room_id: roomId,
          p_wallet: walletAddress || 'guest',
          p_username: myUsername,
          p_content: txt
      });
      
      if (error || (data && data.error === 'insufficient_token_balance')) {
          alert("Message blocked: Insufficient token balance.");
          input.value = txt;
      }
  };
  input.onkeydown = e => { if(e.key==='Enter') send() };

  const cObj = ALL.find(c => c.id === roomId);
  const headImg = isGeneral ? 
    h('div',{class:'av',style:'width:52px;height:52px;font-size:24px;background:radial-gradient(circle at 35% 35%,#fffbe6,#ffb347 55%,#ff7a2a);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 18px rgba(255,179,71,0.6)'},'✦') :
    h('img',{src:cObj.src,alt:roomName});

  sheet.innerHTML = '';
  sheet.append(
      h('div',{class:'grab'}),
      h('div',{class:'head'}, headImg,
          h('div',{class:'t'},h('h2',null,roomName),h('p',null, isGeneral ? 'General Broadcast' : cObj.tag || 'Community')),
          h('button',{class:'x',onclick:()=>select(null)},'×')
      ),
      h('div',{class:'compose'}, input, h('button',{onclick:send},'Send')),
      feed
  );
  setTimeout(()=> { feed.scrollTop = feed.scrollHeight; }, 100);
}

function select(id){
  selId=id;
  want.dist = id === 'core' ? 820 : id ? 400 : defDist();
  wantCenY = id ? H*.25 : H*.5;
  dock.classList.toggle('hide', !!id);
  
  if(!id) { sheet.classList.remove('open'); if(currentChannel) sb.removeChannel(currentChannel); return; }
  sheet.classList.add('open');
  
  if(id === 'core') openChat('00000000-0000-0000-0000-000000000000', 'General Chat', '#ffb347');
  else {
      const room = ALL.find(c=>c.id===id);
      if(room) openChat(room.id, room.name, room.color, room.ca);
  }
}

// ═══════════════════════════════════════════════════════
// 3. CA CREATION MODAL LOGIC
// ═══════════════════════════════════════════════════════
modalCloseBtn.onclick = () => { modal.classList.remove('open'); caInput.value = ''; };
modal.onclick = (e) => { if (e.target === modal) { modal.classList.remove('open'); caInput.value = ''; } };

createBtn.onclick = async () => {
    const ca = caInput.value.trim();
    if(!ca || ca.length < 30) { alert("Invalid CA"); return; }
    
    createBtn.disabled = true;
    createBtn.textContent = "SCANNING BLOCKCHAIN...";
    
    try {
        const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${ca}`);
        const json = await res.json();
        const pair = json.pairs?.[0];
        
        if(!pair) throw new Error("Token not found on DexScreener");
        
        const name = pair.baseToken.name || 'Unknown';
        const symbol = pair.baseToken.symbol || 'TOKEN';
        const logo = pair.info?.imageUrl || '';
        const color = COLORS[Math.floor(Math.random()*COLORS.length)];
        
        const { error } = await sb.from('orbit_communities').insert({
            name: name,
            tagline: symbol,
            ca: ca,
            logo_url: logo,
            color: color,
            emoji: '🪐'
        });
        
        if(error) throw error;
        
        modal.classList.remove('open');
        caInput.value = '';
        await initApp(); 
        
    } catch (err) {
        alert("Error: " + err.message);
    } finally {
        createBtn.disabled = false;
        createBtn.textContent = "Launch Planet";
    }
};

// ═══════════════════════════════════════════════════════
// 4. BOOT (Epic Blur & Dummy Planets)
// ═══════════════════════════════════════════════════════
async function initApp() {
    if(!W) resize();
    
    // ⚑ 1. GENERATE EPIC DUMMY PLANETS FOR LOADING BLUR
    const temp = [
        { id: 't1', name: '', tag: '', color: '#ff7a3d', emoji: '🪐', members: 5000 },
        { id: 't2', name: '', tag: '', color: '#b45cff', emoji: '🌍', members: 2000 },
        { id: 't3', name: '', tag: '', color: '#3aa0ff', emoji: '🌙', members: 800 },
        { id: 't4', name: '', tag: '', color: '#3ddc84', emoji: '☄️', members: 300 }
    ];
    ALL = temp.map(p => hyd(p));
    layout();
    
    cenY = wantCenY;
    want.dist = defDist();
    cam.dist = defDist() * 1.5; 
    
    // ⚑ 2. FETCH REAL DATA
    await syncAll();
    
    // ⚑ 3. REBUILD WITH REAL DATA
    layout();
    buildDock();
    
    // ⚑ 4. EPIC REVEAL
    document.body.classList.remove('booting');
}

requestAnimationFrame(frame);
initApp();
</script>
